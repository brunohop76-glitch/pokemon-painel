<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Busca Universal — O DIÁRIO TCG</title><style>:root{--bg:#170604;--panel:#351006;--orange:#e65b18;--gold:#ffc62b;--text:#fff3d5;--muted:#d4a36e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#6b260d33,transparent 35%),linear-gradient(135deg,#170604,#3a1207,#170604);color:var(--text);font-family:Arial,sans-serif}.top{height:64px;padding:10px 18px;display:flex;align-items:center;gap:12px;background:#260904;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:5}.btn{background:linear-gradient(#f47a1b,#c83a16);border:2px solid var(--gold);color:white;padding:10px 15px;border-radius:8px;font-weight:900;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:25px 18px}.hero{background:linear-gradient(135deg,#561a08,#260904);border:2px solid #a94d13;border-radius:14px;padding:22px;box-shadow:0 10px 25px #0008}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:var(--muted)}.search{display:flex;gap:10px;margin-top:18px}.search input{flex:1;background:#180603;color:white;border:2px solid #9d4912;border-radius:9px;padding:13px;font-size:16px}.search input:focus{outline:none;border-color:var(--gold)}.results{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{background:linear-gradient(#421607,#230904);border:2px solid #93430f;border-radius:12px;padding:12px;cursor:pointer}.card:hover{border-color:var(--gold);transform:translateY(-2px)}.card img{width:100%;height:190px;object-fit:contain;background:#f0e1c9;border-radius:8px}.type{font-size:11px;color:var(--gold);font-weight:900;margin-top:8px}.name{font-weight:900;font-size:16px;margin-top:4px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.section{margin-top:22px}.section h2{font-size:17px;color:#ffd98f}.empty{padding:35px;text-align:center;border:1px dashed #93430f;border-radius:12px;color:var(--muted)}@media(max-width:650px){.search{flex-direction:column}.results{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card img{height:145px}.wrap{padding:14px 10px}.hero h1{font-size:25px}}</style></head><body><header class="top"><button class="btn" onclick="location.href='index.html'">← Painel</button><b>🔎 Busca Universal</b></header><main class="wrap"><section class="hero"><h1>Busca Universal</h1><p>Pesquise Pokémon, cartas TCG e coleções em um só lugar.</p><div class="search"><input id="q" placeholder="Ex.: Charizard, Base Set, 4/102..." autocomplete="off"><button class="btn" onclick="buscar()">Pesquisar</button></div></section><section id="out"><div class="empty">Digite algo para começar.</div></section></main><script>const pokeCache=new Map();async function buscar(){const q=document.getElementById('q').value.trim();if(!q)return;const out=document.getElementById('out');out.innerHTML='<div class="empty">🔄 Pesquisando...</div>';let p=[];try{const r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=100000');const j=await r.json();p=j.results.filter(x=>x.name.includes(q.toLowerCase())).slice(0,12).map(x=>({name:x.name,url:x.url}))}catch(e){}let html='<div class="section"><h2>🐾 Pokémon</h2>';if(p.length){html+='<div class="results">'+p.map(x=>{const id=x.url.split('/').filter(Boolean).pop();return `<article class="card" onclick="location.href='pokemon.html?id=${id}'"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png" onerror="this.style.display='none'"><div class="type">POKÉMON</div><div class="name">${x.name}</div><div class="meta">Abrir ficha completa →</div></article>`}).join('')+'</div>'}else html+='<div class="empty">Nenhum Pokémon encontrado.</div>';html+='</div><div class="section"><h2>🃏 Cartas TCG</h2><div class="empty">Use o catálogo de Cartas TCG para pesquisar cartas e sets com os dados oficiais disponíveis.</div></div>';out.innerHTML=html}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});</script></body></html>
