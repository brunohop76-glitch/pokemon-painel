<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon — O DIÁRIO TCG</title>
<style>
:root{--bg:#160704;--panel:#2b1208;--panel2:#1d0b05;--gold:#ffd044;--orange:#a75b20;--cream:#ffe9bd;--muted:#c99b6c;--line:#7d4218;--green:#4e8d63}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.btn{border:2px solid var(--gold);background:linear-gradient(#ef5530,#b92f1d);color:#fff;padding:10px 15px;border-radius:9px;font-weight:900;cursor:pointer;text-decoration:none}.hero{background:linear-gradient(135deg,#5d240f,#2c1007);border:2px solid var(--orange);border-radius:16px;padding:20px}.hero h1{margin:0;text-transform:capitalize;font-size:34px}.num{color:var(--gold);font-weight:900;margin-bottom:4px}.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}.panel{background:var(--panel);border:2px solid var(--line);border-radius:15px;padding:18px}.art{height:340px;background:radial-gradient(circle,#713315,#1c0804 70%);border-radius:12px;display:flex;align-items:center;justify-content:center}.art img{width:310px;height:310px;object-fit:contain}.art img.failed{display:none}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;background:#35170a;border:1px solid var(--orange);border-radius:8px;padding:8px 11px;color:var(--cream);font-weight:800;text-transform:capitalize}.type-badge{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:112px;padding:8px 13px;border-radius:7px;border:1px solid #ffffff33;color:#fff;font-size:13px;font-weight:900;text-transform:capitalize;text-shadow:0 1px 2px #000;box-shadow:inset 0 1px #ffffff30,0 2px 5px #0005}.type-icon{font-size:15px}.type-fire{background:#f57c22}.type-flying{background:#63c7e8}.type-water{background:#4598cb}.type-electric{background:#f2d52c;color:#2b2100;text-shadow:none}.type-rock{background:#a58b17}.type-grass{background:#5aae55}.type-ice{background:#75d9e7;color:#12323a}.type-ground{background:#b88a43}.type-psychic{background:#ee6b9c}.type-bug{background:#8aa52b}.type-poison{background:#9b5aae}.type-ghost{background:#735b9d}.type-dark{background:#51413d}.type-steel{background:#8b9aa5}.type-fairy{background:#e89ac4}.type-dragon{background:#7460d1}.type-fighting{background:#c95743}.type-normal{background:#9d9d8c}.type-section{margin-top:18px}.type-section h3{margin:0 0 9px;font-size:13px;color:var(--cream);text-transform:uppercase;letter-spacing:.7px}.type-list{display:flex;gap:8px;flex-wrap:wrap}.effect-badge{position:relative}.mult{display:inline-flex;align-items:center;justify-content:center;margin-left:2px;min-width:25px;height:20px;padding:0 5px;border-radius:5px;background:#0008;color:#fff;font-size:10px;font-weight:900}.weak-list .type-badge{border-color:#ffb08c}.resist-list .type-badge{border-color:#9ee6ad}.immune-list .type-badge{border-color:#b9d8ff}
.stats{display:flex;flex-direction:column;gap:10px}.statRow{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}.statHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;text-transform:capitalize;font-size:13px}.statValue{color:var(--gold);font-weight:900}.bar{height:9px;background:#120603;border:1px solid #5f2b12;border-radius:8px;overflow:hidden}.barFill{height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#e24b20,#ffd044);transition:width .35s ease}.statTotal{margin-top:12px;color:var(--cream);font-weight:900;text-align:right}.evo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.evoItem{display:flex;align-items:center;gap:8px;background:#35170a;border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-decoration:none;color:#fff;text-transform:capitalize;transition:.15s}.evoItem:hover{border-color:var(--gold);transform:translateY(-2px)}.evoItem img{width:54px;height:54px;object-fit:contain}.evoArrow{color:var(--gold);font-size:20px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;text-decoration:none;color:#fff}.card:hover{border-color:var(--gold);transform:translateY(-2px)}.card img{width:100%;height:205px;object-fit:contain;background:#e9ddc5;border-radius:7px}.card small{display:block;color:var(--muted);padding:5px 2px}.empty{padding:28px;text-align:center;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}.loading{padding:50px;text-align:center;color:var(--muted)}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}.cardsLink{display:inline-block;margin-top:10px;color:var(--gold);font-weight:900;text-decoration:none}.cardsLink:hover{text-decoration:underline}
@media(max-width:800px){.wrap{padding:12px}.layout{grid-template-columns:1fr}.art{height:300px}.art img{width:270px;height:270px}.top{align-items:flex-start}.hero h1{font-size:27px}.type-badge{min-width:100px}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><a class="btn" href="pokedex.html">← Voltar para a Pokédex</a><a class="btn" href="index.html">🏠 Painel</a></div><div id="app"><div class="loading"><span class="spinner"></span>Carregando Pokémon...</div></div></div>
<script>
const API='https://pokeapi.co/api/v2';
const SPR='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
const SPRFALL='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const TCG='https://api.pokemontcg.io/v2/cards';
const id=Math.max(1,Number(new URLSearchParams(location.search).get('id')||1));
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function img(id){return SPR+id+'.png'}
function fallback(el,id){const a=Number(el.dataset.a||0);if(a===0){el.dataset.a=1;el.src=SPRFALL+id+'.png'}else el.classList.add('failed')}
function speciesId(url){const m=String(url||'').match(/\/pokemon-species\/(\d+)\/?$/);return m?Number(m[1]):null}
function flattenChain(node,out=[]){const sid=speciesId(node.species.url);out.push({name:node.species.name,id:sid});(node.evolves_to||[]).forEach(x=>flattenChain(x,out));return out}
async function json(url){const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
const TYPE_INFO={normal:{label:'Normal',icon:'●'},fire:{label:'Fogo',icon:'🔥'},water:{label:'Água',icon:'💧'},electric:{label:'Elétrico',icon:'⚡'},grass:{label:'Grama',icon:'🌿'},ice:{label:'Gelo',icon:'❄️'},fighting:{label:'Lutador',icon:'🥊'},poison:{label:'Veneno',icon:'☠️'},ground:{label:'Terrestre',icon:'⛰️'},flying:{label:'Voador',icon:'🪽'},psychic:{label:'Psíquico',icon:'🔮'},bug:{label:'Inseto',icon:'🐛'},rock:{label:'Rocha',icon:'🪨'},ghost:{label:'Fantasma',icon:'👻'},dragon:{label:'Dragão',icon:'🐉'},dark:{label:'Sombrio',icon:'🌑'},steel:{label:'Aço',icon:'⚙️'},fairy:{label:'Fada',icon:'✨'}};
function typeBadge(type,mult){const info=TYPE_INFO[type]||{label:type,icon:'◆'};const m=mult===1?'':`<span class="mult">${mult===0?'0×':mult===0.25?'¼×':mult===0.5?'½×':mult===2?'×2':mult===4?'×4':mult+'×'}</span>`;return `<span class="type-badge type-${esc(type)} effect-badge"><span class="type-icon">${info.icon}</span>${info.label}${m}</span>`}
function effectivenessMap(types){const map={};return Promise.all(types.map(t=>json(API+'/type/'+t).catch(()=>null))).then(rows=>{rows.forEach(row=>{const rel=row?.damage_relations||{};const add=(list,m)=>list.forEach(x=>{map[x.name]=(map[x.name]??1)*m});add(rel.double_damage_from||[],2);add(rel.half_damage_from||[],.5);add(rel.no_damage_from||[],0)});return map})}
function relationGroups(map){const weak=[],resist=[],immune=[];Object.entries(map).forEach(([type,mult])=>{if(mult>=2)weak.push([type,mult]);else if(mult===0)immune.push([type,mult]);else if(mult<1)resist.push([type,mult])});const order=(a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]);weak.sort(order);resist.sort(order);immune.sort((a,b)=>a[0].localeCompare(b[0]));return{weak,resist,immune}}
function relationHTML(title,items,cls,empty){return `<div class="type-section ${cls}"><h3>${title}</h3><div class="type-list">${items.length?items.map(([t,m])=>typeBadge(t,m)).join(''):`<span style="color:var(--muted);font-size:12px">${empty}</span>`}</div></div>`}
function statLabel(name){return ({'hp':'HP','attack':'Ataque','defense':'Defesa','special-attack':'Ataque Especial','special-defense':'Defesa Especial','speed':'Velocidade'})[name]||name.replaceAll('-',' ')}
function statsHTML(stats){const total=stats.reduce((n,s)=>n+s.base_stat,0);return `<div class="stats">${stats.map(s=>{const pct=Math.min(100,(s.base_stat/180)*100);return `<div class="statRow"><div class="statHead"><span>${esc(statLabel(s.stat.name))}</span><span class="statValue">${s.base_stat}</span></div><div class="bar"><div class="barFill" style="width:${pct}%"></div></div></div>`}).join('')}</div><div class="statTotal">Total de atributos: ${total}</div>`}
function evoHTML(chain){if(!chain.length)return '<div class="empty">Linha evolutiva não disponível.</div>';return `<div class="evo">${chain.map((x,i)=>`${i?'<span class="evoArrow">→</span>':''}<a class="evoItem" href="pokemon.html?id=${x.id||1}"><img src="${img(x.id||1)}" loading="lazy" onerror="fallback(this,${x.id||1})" alt="${esc(x.name)}"><span>${esc(x.name)}</span></a>`).join('')}</div>`}
async function load(){try{const[p,s]=await Promise.all([json(API+'/pokemon/'+id),json(API+'/pokemon-species/'+id)]);let chain=[];try{const e=await json(s.evolution_chain.url);chain=flattenChain(e.chain)}catch{}const typeMap=await effectivenessMap(p.types.map(x=>x.type.name));const relations=relationGroups(typeMap);const abilities=p.abilities.map(x=>`<span class="chip">${esc(x.ability.name)}${x.is_hidden?' · oculta':''}</span>`).join('');const types=p.types.map(x=>typeBadge(x.type.name,1)).join('');document.title='#'+String(id).padStart(4,'0')+' '+p.name+' — O DIÁRIO TCG';app.innerHTML=`<section class="hero"><div class="num">#${String(id).padStart(4,'0')}</div><h1>${esc(p.name)}</h1><p>Informações completas do Pokémon usando a PokéAPI.</p></section><div class="layout"><div><div class="panel"><div class="art"><img src="${img(id)}" onerror="fallback(this,${id})" alt="${esc(p.name)}"></div><div class="type-section"><h3>Tipo</h3><div class="type-list">${types}</div></div><p><b>Altura:</b> ${(p.height/10).toFixed(1)} m<br><b>Peso:</b> ${(p.weight/10).toFixed(1)} kg<br><b>Experiência base:</b> ${p.base_experience??'—'}</p><a class="cardsLink" href="cartas.html?q=${encodeURIComponent(p.name)}">🃏 Ver cartas de ${esc(p.name)} no catálogo TCG →</a></div></div><div><div class="panel"><h2>⚔️ Relações de tipo</h2>${relationHTML('Fraquezas',relations.weak,'weak-list','Nenhuma fraqueza')}${relationHTML('Resistências',relations.resist,'resist-list','Nenhuma resistência')}${relationHTML('Imunidades',relations.immune,'immune-list','Nenhuma imunidade')}</div><div class="panel" style="margin-top:16px"><h2>📊 Atributos base</h2>${statsHTML(p.stats)}</div><div class="panel" style="margin-top:16px"><h2>✨ Habilidades</h2><div class="chips">${abilities||'<span class="empty">Nenhuma habilidade disponível.</span>'}</div></div><div class="panel" style="margin-top:16px"><h2>🧬 Linha evolutiva</h2>${evoHTML(chain)}</div><div class="panel" style="margin-top:16px"><h2>🃏 Cartas TCG relacionadas</h2><div id="cards" class="cards"><div class="empty"><span class="spinner"></span>Buscando cartas...</div></div></div></div></div>`;loadTCG(p.name)}catch(e){app.innerHTML='<div class="empty">❌ Não foi possível carregar este Pokémon. Verifique sua conexão e tente novamente.</div>'}}
async function loadTCG(name){const el=document.getElementById('cards');try{const q=encodeURIComponent('name:"'+name+'"');const j=await json(TCG+'?q='+q+'&pageSize=18');const arr=j.data||[];el.innerHTML=arr.length?arr.map(c=>`<a class="card" href="cartas.html?q=${encodeURIComponent(c.name)}"><img src="${esc(c.images?.small||'')}" loading="lazy" alt="${esc(c.name)}"><small>${esc(c.set?.name||'')}</small></a>`).join(''):'<div class="empty">Nenhuma carta TCG encontrada. <a class="cardsLink" href="cartas.html?q='+encodeURIComponent(name)+'">Pesquisar no catálogo</a></div>'}catch{el.innerHTML='<div class="empty">Cartas TCG indisponíveis no momento. <a class="cardsLink" href="cartas.html?q='+encodeURIComponent(name)+'">Abrir catálogo TCG</a></div>'}}
load();
</script>
</body>
</html>
