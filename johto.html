<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O DIÁRIO TCG - Pokédex Johto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#120b03;color:#fff8e8;font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:24px;background:radial-gradient(circle at 85% 0,#7a3b08,transparent 35%),radial-gradient(circle at 0 100%,#3c1b05,transparent 40%),#120b03}.top{max-width:1500px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:24px;font-weight:900}.brand span{color:#f6c33d}.links{display:flex;gap:8px}.links a{color:#ffe8aa;text-decoration:none;border:2px solid #8d5818;background:#2a1605;border-radius:9px;padding:8px 12px;font-weight:800}.hero{max-width:1500px;margin:20px auto 16px;padding:24px;border:2px solid #b06b1b;border-radius:18px;background:linear-gradient(135deg,#321804,#6b3308);box-shadow:0 8px 25px #0008}.hero h1{margin:0 0 7px;font-size:30px}.sub{color:#f2d59a}.progress{height:12px;background:#2a1708;border-radius:99px;overflow:hidden;margin-top:15px;border:1px solid #744615}.progress span{display:block;height:100%;background:linear-gradient(90deg,#d88918,#ffe066)}.tools{max-width:1500px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1;min-width:250px;background:#1c1006;border:2px solid #754714;color:white;border-radius:10px;padding:11px}.tools button{border:2px solid #754714;background:#241306;color:#f0d7a1;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:800}.tools button.active{background:#c34f1c;border-color:#ffc943;color:#fff}.grid{max-width:1500px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.pokemon{background:#211105;border:2px solid #633b14;border-radius:13px;overflow:hidden;box-shadow:0 7px 18px #0007}.pokemon.owned{border-color:#39cf80;box-shadow:0 0 0 1px #39cf8044,0 7px 18px #0007}.img{height:150px;background:radial-gradient(circle,#71400d,#160c03 72%);position:relative;display:flex;align-items:center;justify-content:center}.img img{width:135px;height:135px;object-fit:contain}.pokemon:not(.owned) img{filter:grayscale(1) brightness(.42);opacity:.7}.num{position:absolute;left:7px;top:7px;color:#d3a968;font-size:10px;font-weight:bold}.mark{position:absolute;right:7px;top:7px;background:#18a96d;color:white;border-radius:99px;padding:4px 6px;font-size:9px;display:none}.owned .mark{display:block}.body{padding:9px}.name{text-transform:capitalize;font-weight:900}.status{font-size:10px;color:#bd9b67;margin-top:3px}.body button{width:100%;margin-top:8px;border:1px solid #8a5418;background:#351b07;color:#f4dca7;border-radius:7px;padding:7px;font-size:10px;cursor:pointer}.owned .body button{background:#123b2c;border-color:#208c62;color:#9dffd2}@media(max-width:650px){.wrap{padding:12px}.top{align-items:flex-start}.brand{font-size:17px}.links a{font-size:10px;padding:7px}.hero{padding:16px}.hero h1{font-size:22px}.grid{grid-template-columns:repeat(3,1fr);gap:7px}.img{height:105px}.img img{width:95px;height:95px}.body{padding:7px}.name{font-size:10px}.status{font-size:8px}.body button{font-size:8px;padding:6px}.tools input{min-width:160px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">🃏 O DIÁRIO <span>TCG</span></div><div class="links"><a href="index.html">🏠 Painel</a><a href="kanto.html">🔴 Kanto</a></div></div>
<div class="hero"><h1>🟡 Pokédex Johto</h1><div class="sub">Marque os 100 Pokémon da região de Johto que você já possui na coleção.</div><div class="progress"><span id="bar" style="width:0"></span></div></div>
<div class="tools"><input id="search" placeholder="🔎 Procurar Pokémon..." oninput="render()"><button id="all" class="active" onclick="view='all';buttons();render()">Todos</button><button id="owned" onclick="view='owned';buttons();render()">Tenho</button><button id="missing" onclick="view='missing';buttons();render()">Faltam</button><button onclick="clearMarks()">↺ Limpar marcações</button></div>
<div id="grid" class="grid"></div>
</div>
<script>
const P=['Chikorita','Bayleef','Meganium','Cyndaquil','Quilava','Typhlosion','Totodile','Croconaw','Feraligatr','Sentret','Furret','Hoothoot','Noctowl','Ledyba','Ledian','Spinarak','Ariados','Crobat','Chinchou','Lanturn','Pichu','Cleffa','Igglybuff','Togepi','Togetic','Natu','Xatu','Mareep','Flaaffy','Ampharos','Bellossom','Marill','Azumarill','Sudowoodo','Politoed','Hoppip','Skiploom','Jumpluff','Aipom','Sunkern','Sunflora','Yanma','Wooper','Quagsire','Espeon','Umbreon','Murkrow','Slowking','Misdreavus','Unown','Wobbuffet','Girafarig','Pineco','Forretress','Dunsparce','Gligar','Steelix','Snubbull','Granbull','Qwilfish','Scizor','Shuckle','Heracross','Sneasel','Teddiursa','Ursaring','Slugma','Magcargo','Swinub','Piloswine','Corsola','Remoraid','Octillery','Delibird','Mantine','Skarmory','Houndour','Houndoom','Kingdra','Phanpy','Donphan','Porygon2','Stantler','Smeargle','Tyrogue','Hitmontop','Smoochum','Elekid','Magby','Miltank','Blissey','Raikou','Entei','Suicune','Larvitar','Pupitar','Tyranitar','Lugia','Ho-Oh','Celebi'];
let view='all';const KEY='odtcg_johto_100';
const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]').map(Number)}catch(e){return[]}};
const save=a=>localStorage.setItem(KEY,JSON.stringify([...new Set(a)]));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function buttons(){document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));document.getElementById(view).classList.add('active')}
function toggle(id){let a=get();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];save(a);render()}
function clearMarks(){if(confirm('Limpar todas as marcações de Johto?')){localStorage.removeItem(KEY);render()}}
function render(){let a=get(),q=document.getElementById('search').value.toLowerCase();document.getElementById('bar').style.width=(a.length/100*100)+'%';document.querySelector('.count')?.remove();let count=document.createElement('div');count.className='count';count.textContent=a.length+' / 100';document.querySelector('.hero .sub').appendChild(count);let list=P.map((name,i)=>({name,id:i+152,own:a.includes(i+1)})).filter(x=>(!q||x.name.toLowerCase().includes(q)||String(x.id).includes(q))&&(view==='all'||view==='owned'&&x.own||view==='missing'&&!x.own));document.getElementById('grid').innerHTML=list.map(x=>'<article class="pokemon '+(x.own?'owned':'')+'"><div class="img"><span class="num">#'+String(x.id).padStart(3,'0')+'</span><span class="mark">✓ TENHO</span><img loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+x.id+'.png" alt="'+esc(x.name)+'"></div><div class="body"><div class="name">'+esc(x.name)+'</div><div class="status">'+(x.own?'Na coleção':'Ainda não tenho')+'</div><button onclick="toggle('+(x.id-151)+')">'+(x.own?'✓ Marcar como faltando':'＋ Marcar como tenho')+'</button></div></article>').join('')}
render();
</script>
</body></html>
