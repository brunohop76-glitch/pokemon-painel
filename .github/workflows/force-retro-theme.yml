name: Forcar tema FireRed GBA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  force-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Injetar CSS definitivo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css='force-retro-gba.css'
          marker=f'<link rel="stylesheet" href="{css}?v=20260818-1">'

          for name in ('index.html','app.html'):
              p=Path(name)
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              if marker not in text:
                  if '</head>' in text:
                      text=text.replace('</head>', marker+'\n</head>', 1)
                  else:
                      text=marker+'\n'+text
                  p.write_text(text, encoding='utf-8')
          PY

      - name: Commitar alteracoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html force-retro-gba.css .github/workflows/force-retro-theme.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git commit -m "Forcar tema FireRed GBA no painel"
          git push
