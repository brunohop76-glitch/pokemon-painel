name: Otimizar painel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remover CSS duplicado do index
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = ':root{--retro-bg:#170604'
          start = text.find(marker)

          if start == -1:
              print('CSS retro inline não encontrado; nada a fazer.')
          else:
              end = text.find('</style>', start)
              if end == -1:
                  raise SystemExit('Tag </style> não encontrada.')

              # O mesmo tema já existe em retro-final.css. Mantemos apenas
              # o CSS mínimo de carregamento dentro do HTML.
              text = text[:start] + text[end:]
              text = text.replace('retro-final.css?v=20260817-4', 'retro-final.css?v=20260819-1', 1)
              path.write_text(text, encoding='utf-8')
              print('CSS inline duplicado removido e cache do tema atualizado.')

      - name: Publicar e remover workflow temporário
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/otimizar-painel.yml
          git commit -m 'Otimizar painel: remover CSS duplicado'
          git push
