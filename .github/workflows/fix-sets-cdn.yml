name: Fix Sets CDN

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sets-cdn.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace unstable GitHub Raw CDN with jsDelivr
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master"
          new = "https://cdn.jsdelivr.net/gh/PokemonTCG/pokemon-tcg-data@master"
          if old not in text:
              print('Target URL already fixed or not present.')
          else:
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
              print('Sets/cards CDN updated.')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix online TCG catalog CDN'
            git push
          fi
