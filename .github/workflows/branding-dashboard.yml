name: Aplicar logo e frase do Dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Aplicar identidade visual
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* DASHBOARD BRANDING V1 */'
          if marker in s:
              raise SystemExit(0)
          css = r'''
          /* DASHBOARD BRANDING V1 */
          .brand{display:flex;align-items:center;gap:9px;height:100%}
          .brandLogo{width:132px;height:50px;object-fit:contain;display:block}
          .dashboardIntro{margin:0 0 18px;color:#b9c9ee;line-height:1.45;max-width:850px}
          @media(max-width:650px){.brandLogo{width:108px;height:42px}.dashboardIntro{font-size:12px}}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)
          old_brand = '<div class="brand">🃏 O DIÁRIO <span>TCG</span></div>'
          new_brand = '<div class="brand"><img class="brandLogo" src="logo.svg" alt="O DIÁRIO TCG"></div>'
          if old_brand not in s:
              raise SystemExit('Marca do cabeçalho não encontrada')
          s = s.replace(old_brand, new_brand, 1)
          old_dash = '<section id="dashboard" class="page"><div class="title"><h1>🏠 Dashboard</h1><p>Resumo da coleção.</p></div>'
          new_dash = '<section id="dashboard" class="page"><div class="title"><h1>🏠 Dashboard</h1><p class="dashboardIntro">Sua jornada Pokémon começa aqui — colecione, organize e complete sua coleção de cartas!</p></div>'
          if old_dash not in s:
              raise SystemExit('Texto do Dashboard não encontrado')
          s = s.replace(old_dash, new_dash, 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Adicionar logo e frase temática ao Dashboard'
          git push
