name: Aplicar tema Pokémon e layout mobile
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Aplicar tema retro laranja e layout mobile
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          retro = Path('retro.css').read_text(encoding='utf-8') if Path('retro.css').exists() else ''
          if retro and 'id="odtcg-retro-theme"' not in s:
              s = s.replace('</style>', '<style id="odtcg-retro-theme">'+retro+'</style>\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restaurar tema retro laranja no painel'
          git push
