name: Aplicar tema Pokémon e layout mobile
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Aplicar tema e responsividade
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MOBILE APP + POKEMON THEME V1 */'
          if marker in s:
              print('Tema já aplicado.')
              raise SystemExit(0)
          css = r'''
          /* MOBILE APP + POKEMON THEME V1 */
          :root{--pk-blue:#2459d6;--pk-blue2:#173b9b;--pk-yellow:#ffd83d;--pk-red:#e53935;--pk-dark:#070b18;--pk-panel:#0d1426;--pk-line:#26385f;--pk-text:#f7f9ff}
          body{background:#050914;color:var(--pk-text)}
          .app{background:radial-gradient(circle at 80% 0,#153b86 0,transparent 30%),radial-gradient(circle at 0 100%,#171d46 0,transparent 35%),#050914}
          .top{height:64px;background:rgba(6,11,24,.94);border-bottom:2px solid var(--pk-blue);backdrop-filter:blur(12px);padding:0 24px}
          .brand{letter-spacing:.2px}.brand span{color:var(--pk-yellow)}
          .pill{border-color:#4569c8;background:#0e1b3a;color:#dce6ff}
          .btn{background:linear-gradient(135deg,var(--pk-blue),#4b7cff);box-shadow:0 5px 18px #153b9b55}.btn.dark{background:#101a31;border-color:#3b5795}.btn.danger{background:var(--pk-red)}
          .layout{grid-template-columns:225px 1fr}
          .side{background:rgba(7,12,26,.94);border-right:1px solid #24345d;padding:18px 12px;top:64px;height:calc(100vh - 64px)}
          .side h3{color:#8199d8}
          .nav{color:#cbd6f4}.nav:hover,.nav.active{background:linear-gradient(90deg,#163d91,#10275e);color:#fff;border-left:3px solid var(--pk-yellow);padding-left:9px}
          .main{padding:22px 28px 36px}
          .title h1{color:#fff}.title p{color:#9fb1d8}
          .titleRow{margin-bottom:14px}
          .search,.pokeTools input{background:#091226;border-color:#2d4b91;color:#fff}
          .filters{margin:8px 0 16px}.chip{background:#0b1428;border-color:#2d4b91;color:#b9c9ee}.chip.active{background:var(--pk-blue);border-color:#6c8fff;color:#fff}
          .content{gap:18px}.filterbox{background:#0a1223;border-color:#263e78}.filterbox select{background:#0e1930;border-color:#2d4b91}
          .grid{gap:14px}.card{background:linear-gradient(180deg,#101c35,#080e1c);border-color:#29457f;box-shadow:0 8px 22px #0005}.card:hover{border-color:var(--pk-yellow);transform:translateY(-2px)}
          .cardImg{background:#e9edf5}.tag{background:var(--pk-blue)}.stock{color:#5ff0ad}
          .pokeHero{background:linear-gradient(135deg,#0d1d43,#172b65);border-color:#345bc0}.progress{background:#111d36}.progress span{background:linear-gradient(90deg,var(--pk-blue),var(--pk-yellow))}
          .pokeCard{background:#0b1325;border-color:#263e78}.pokeCard.owned{border-color:#35d18a}.pokeImg{background:radial-gradient(circle,#1a3b82,#071020 70%)}
          .pokeTools button{background:#0b1428;border-color:#2d4b91;color:#b9c9ee}.pokeTools button.active{background:var(--pk-blue);color:#fff}
          .modal{background:#0b1222;border-color:#3454a0}.lookup{background:#0a1428;border-color:#31519a}.field input,.field select,.field textarea,.lookupTop input{background:#071020;border-color:#2d4b91}.preview{background:#0d1930;border-color:#31519a}
          .drawer{background:#02050dcc}
          @media(max-width:1000px){
            .top{height:58px;padding:0 14px}.layout{display:block}.side{position:sticky;top:58px;height:auto;min-height:0;padding:7px 9px;z-index:19;border-right:0;border-bottom:1px solid #24345d;overflow-x:auto;white-space:nowrap;background:rgba(7,12,26,.97)}
            .side h3{display:none}.nav{display:inline-flex;width:auto;align-items:center;margin:0 3px;padding:9px 11px;border-left:0}.nav:hover,.nav.active{padding-left:11px;border-left:0;border-bottom:3px solid var(--pk-yellow)}
            .main{padding:16px 15px 30px}.titleRow{display:block}.controls{justify-content:stretch;margin-top:12px}.controls .search{flex:1}.content{grid-template-columns:1fr}.filterbox{position:static}.filterbox{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}.filterbox h3{grid-column:1/-1}.filterbox label{margin:6px 0}.filterbox>div,.filterbox select{margin:3px 0}
          }
          @media(max-width:650px){
            body{font-size:14px}.top{height:54px}.brand{font-size:17px}.topActions .pill{padding:6px 9px}.topActions .btn{font-size:0;padding:9px 11px}.topActions .btn:before{content:'＋';font-size:17px}.side{top:54px}.nav{font-size:12px;padding:8px 9px}.main{padding:12px 10px 26px}.title h1{font-size:27px}.title p{font-size:12px}.search{min-width:0}.controls{gap:6px}.controls .btn{padding:10px 11px}.filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px}.chip{white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cardImg{height:220px}.body{padding:9px}.name{font-size:13px}.price{font-size:15px}.actions{gap:4px}.actions .btn{padding:7px 8px;font-size:11px}.formGrid{grid-template-columns:1fr}.modal{width:100%;max-height:94vh;border-radius:16px}.modalBody{padding:13px}.lookupTop{flex-direction:column}.preview{grid-template-columns:1fr}.preview img{width:100%;height:260px}.pokeGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.pokeImg{height:100px}.pokeImg img{width:90px;height:90px}.pokeBody{padding:7px}.pokeName{font-size:10px}.pokeStatus{font-size:9px}.pokeBody button{font-size:9px;padding:6px 3px}.pokeHero{padding:16px;border-radius:15px}.pokeHero h1{font-size:20px}.pokeHero p{font-size:11px}.pokeTools{gap:5px}.pokeTools input{min-width:100%;flex-basis:100%}.pokeTools button{font-size:11px;padding:7px 8px}
          }
          '''
          if '</style>' not in s:
              raise SystemExit('Tag </style> não encontrada')
          s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Aplicar tema Pokémon e experiência mobile'
          git push
