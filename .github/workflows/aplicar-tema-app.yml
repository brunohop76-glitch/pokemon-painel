name: Consolidar tema retro e recursos da Pokédex

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Consolidar CSS e remover duplicações do tema
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = Path('retro-final.css').read_text(encoding='utf-8')

          marker = '/* O DIÁRIO TCG — TEMA RETRO LARANJA / FIRE RED */'
          if marker in s:
              start = s.index(marker)
              style_end = s.find('</style>', start)
              if style_end != -1:
                  s = s[:start] + s[style_end:]

          s = re.sub(r'<style id="odtcg-retro-theme">.*?</style>', '', s, flags=re.S)
          if '</style>' in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          else:
              s = s.replace('</head>', '<style>\n' + css + '\n</style>\n</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Integrar recursos extras da Pokédex
        shell: python
        run: |
          from pathlib import Path
          p = Path('pokedex-original.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              tag='<script src="pokedex-enhancements.js"></script>'
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
                  p.write_text(s,encoding='utf-8')

      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pokedex-original.html
          git diff --cached --quiet && exit 0
          git commit -m 'Consolidar tema e integrar dados extras da Pokedex'
          git push
