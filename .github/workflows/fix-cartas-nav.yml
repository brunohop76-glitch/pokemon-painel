name: Corrigir menu Cartas TCG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir carregamento dos scripts do painel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'enhancements.js?v=20260819-2'
          if marker not in s:
              s = s.replace('</body>', '<script src="enhancements.js?v=20260819-2"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nada para corrigir."
          else
            git commit -m "Forçar atualização do menu do painel"
            git push
          fi
