<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex Completa — O DIÁRIO TCG</title>
<style>
:root{--bg:#170604;--panel:#351107;--panel2:#240a04;--red:#d74618;--gold:#ffc62b;--cream:#fff0cf;--muted:#d3a06a;--line:#9a4912}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#170604,#3a1207 55%,#160603);color:var(--cream);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1500px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#5c210c,#2a0b04);border:2px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 8px 20px #0008}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:var(--muted)}.toolbar{display:grid;grid-template-columns:minmax(220px,2fr) minmax(170px,1fr) minmax(170px,1fr) auto;gap:8px}.input,select{width:100%;background:#1d0804;color:var(--cream);border:2px solid var(--line);border-radius:7px;padding:11px}.input:focus,select:focus{outline:none;border-color:var(--gold)}.btn{border:2px solid var(--gold);background:linear-gradient(#e95c1c,#b92e14);color:#fff;padding:10px 14px;border-radius:7px;font-weight:900;cursor:pointer;white-space:nowrap}.btn.secondary{background:#351107;border-color:#99501a}.btn.active{background:linear-gradient(#ffc933,#d98a0d);color:#1b0804}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.count{color:var(--muted);margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-top:14px}.poke{position:relative;background:linear-gradient(#421608,#220a04);border:2px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;content-visibility:auto;contain-intrinsic-size:245px}.poke:hover{transform:translateY(-2px);border-color:var(--gold)}.poke.viewed{border-color:#69a54e}.img{height:185px;background:radial-gradient(circle,#81320d,#1c0704 72%);display:flex;align-items:center;justify-content:center}.img img{width:165px;height:165px;object-fit:contain}.img img.failed{opacity:0}.body{padding:9px}.num{color:#ffe0a0;font-size:12px}.name{font-weight:900;font-size:17px;text-transform:capitalize;margin-top:3px}.types{margin-top:6px;color:#ffe7bd;font-size:12px}.badge{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:5px;background:#28551c;color:#d9ffd0;font-size:10px;font-weight:900}.fav{position:absolute;right:7px;top:7px;z-index:2;width:34px;height:34px;border:1px solid #c88b27;border-radius:50%;background:#1b0805dd;color:#fff;font-size:18px;cursor:pointer}.fav.on{color:#ffd044;background:#5a280d}.empty{padding:40px;text-align:center;border:2px dashed var(--line);border-radius:10px;color:var(--muted);grid-column:1/-1}.pagination{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:18px 0}.page-info{color:var(--muted);margin:0 8px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}.box{width:min(1050px,100%);max-height:94vh;overflow:auto;background:#2b1007;border:2px solid var(--gold);border-radius:12px}.head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:16px}.detail{display:grid;grid-template-columns:250px 1fr;gap:18px}.detail>img{width:100%;background:#1d0804;border-radius:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#351107;border:1px solid #9b5120;border-radius:6px;padding:5px 8px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.stat{background:#1d0804;border:1px solid #7d4218;border-radius:7px;padding:9px;display:flex;justify-content:space-between}.evo{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.evoItem{background:#351107;border:1px solid #7d4218;border-radius:6px;padding:7px 9px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.tcg-card img{width:100%;height:185px;object-fit:contain;background:#eadfc9;border-radius:6px}.tcg-card small{display:block;color:var(--muted);padding:3px}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:5px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .input{grid-column:1/-1}.toolbar .btn{width:100%}}
@media(max-width:700px){.wrap{padding:10px}.hero{padding:14px}.hero h1{font-size:25px}.toolbar{grid-template-columns:1fr}.toolbar .input{grid-column:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.img{height:145px}.img img{width:130px;height:130px}.detail{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.box{max-height:96vh}.content{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>📘 Pokédex Completa</h1><p>Explore os Pokémon, filtre por geração e tipo, marque favoritos e acompanhe quais você já visitou.</p></section>
<div class="toolbar"><input id="q" class="input" placeholder="Buscar por nome ou número..." autocomplete="off"><select id="gen"><option value="">Todas as gerações</option><option value="1">Geração 1 — Kanto</option><option value="2">Geração 2 — Johto</option><option value="3">Geração 3 — Hoenn</option><option value="4">Geração 4 — Sinnoh</option><option value="5">Geração 5 — Unova</option><option value="6">Geração 6 — Kalos</option><option value="7">Geração 7 — Alola</option><option value="8">Geração 8 — Galar</option><option value="9">Geração 9 — Paldea</option></select><select id="type"><option value="">Todos os tipos</option><option value="normal">Normal</option><option value="fire">Fogo</option><option value="water">Água</option><option value="electric">Elétrico</option><option value="grass">Grama</option><option value="ice">Gelo</option><option value="fighting">Lutador</option><option value="poison">Veneno</option><option value="ground">Terrestre</option><option value="flying">Voador</option><option value="psychic">Psíquico</option><option value="bug">Inseto</option><option value="rock">Pedra</option><option value="ghost">Fantasma</option><option value="dragon">Dragão</option><option value="dark">Sombrio</option><option value="steel">Aço</option><option value="fairy">Fada</option></select><button id="refresh" class="btn">↻ Atualizar</button></div>
<div class="actions"><button id="favFilter" class="btn secondary">☆ Favoritos</button><button id="viewedFilter" class="btn secondary">✓ Já vistos</button><button id="unviewedFilter" class="btn secondary">○ Não vistos</button><button id="clearMarks" class="btn secondary">Limpar favoritos/vistos</button></div>
<div id="status" class="count"></div><div id="grid" class="grid"></div><div id="pagination" class="pagination"></div>
</div>
<div id="modal" class="modal"><div class="box"><div class="head"><b id="title">Pokémon</b><button class="btn" id="close">Fechar</button></div><div id="content" class="content"></div></div></div>
<script>
const API='https://pokeapi.co/api/v2',SPR='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/',FALL='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/',TCG='https://api.pokemontcg.io/v2/cards';
const CACHE='odtcg_pokedex_index_v3',FAV='odtcg_pokedex_favorites_v1',VIEW='odtcg_pokedex_viewed_v1',PAGE=48;let list=[],filtered=[],page=1,typeMap=null,mode='',details=new Map();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const read=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||'[]').map(Number))}catch{return new Set()}};const write=(k,s)=>localStorage.setItem(k,JSON.stringify([...s]));let fav=read(FAV),seen=read(VIEW);
const gen=id=>id<=151?1:id<=251?2:id<=386?3:id<=493?4:id<=649?5:id<=721?6:id<=809?7:id<=905?8:9;
function img(id){return SPR+id+'.png'}function imgFail(el,id){if(!el.dataset.f){el.dataset.f=1;el.src=FALL+id+'.png'}else el.classList.add('failed')}
async function load(force=false){$('status').innerHTML='<span class="spinner"></span>Carregando Pokédex...';$('grid').innerHTML='<div class="empty">🔄 Preparando dados...</div>';let cached=!force?localStorage.getItem(CACHE):null;try{if(cached)list=JSON.parse(cached).list||[];if(!list.length||force){const r=await fetch(API+'/pokemon?limit=1025&offset=0',{cache:'force-cache'});if(!r.ok)throw Error();const j=await r.json();list=j.results.map((x,i)=>({id:i+1,name:x.name,gen:gen(i+1)}));localStorage.setItem(CACHE,JSON.stringify({at:Date.now(),list}))}filter()}catch{$('status').textContent='Não foi possível carregar a Pokédex.';$('grid').innerHTML='<div class="empty">❌ Verifique sua conexão e tente novamente.</div>'}}
async function types(){if(typeMap)return typeMap;const vals=[...$('type').options].map(o=>o.value).filter(Boolean);const rows=await Promise.all(vals.map(async t=>{const key='odtcg_type_'+t;try{const c=localStorage.getItem(key);if(c)return [t,JSON.parse(c)]}catch{}const r=await fetch(API+'/type/'+t,{cache:'force-cache'});const j=await r.json(),ids=j.pokemon.map(x=>Number(String(x.pokemon.url).match(/pokemon\/(\d+)/)?.[1])).filter(Boolean);localStorage.setItem(key,JSON.stringify(ids));return [t,ids]}));return typeMap=new Map(rows)}
async function filter(){const q=$('q').value.toLowerCase().trim(),g=$('gen').value,t=$('type').value;let ids=null;if(t){try{const m=await types();ids=new Set(m.get(t)||[])}catch{return}}filtered=list.filter(p=>(!q||p.name.includes(q)||String(p.id)===q)&&(!g||String(p.gen)===g)&&(!ids||ids.has(p.id))&&(mode==='fav'?fav.has(p.id):mode==='seen'?seen.has(p.id):mode==='unseen'&&!seen.has(p.id)||!mode));page=1;draw()}
function draw(){const pages=Math.max(1,Math.ceil(filtered.length/PAGE));page=Math.min(page,pages);const shown=filtered.slice((page-1)*PAGE,page*PAGE);$('grid').innerHTML=shown.length?shown.map(p=>`<article class="poke ${seen.has(p.id)?'viewed':''}" onclick="openPokemon(${p.id})"><button class="fav ${fav.has(p.id)?'on':''}" onclick="favorite(event,${p.id})">${fav.has(p.id)?'★':'☆'}</button><div class="img"><img src="${img(p.id)}" onerror="imgFail(this,${p.id})" loading="lazy" decoding="async" alt="${esc(p.name)}"></div><div class="body"><div class="num">#${String(p.id).padStart(4,'0')}</div><div class="name">${esc(p.name)}</div><div class="types">Geração ${p.gen}</div>${seen.has(p.id)?'<span class="badge">✓ Já visto</span>':''}</div></article>`).join(''):'<div class="empty">🔎 Nenhum Pokémon encontrado.</div>';$('status').textContent=`${filtered.length} Pokémon encontrados • página ${page}/${pages} • ${fav.size} favoritos • ${seen.size} vistos`;let h='';if(pages>1){h+=`<button class="btn" ${page===1?'disabled':''} onclick="go(${page-1})">‹</button>`;for(let n=1;n<=pages;n++){if(n===1||n===pages||Math.abs(n-page)<=2)h+=`<button class="btn ${n===page?'active':''}" onclick="go(${n})">${n}</button>`}h+=`<button class="btn" ${page===pages?'disabled':''} onclick="go(${page+1})">›</button>`}$('pagination').innerHTML=h}
function go(n){page=n;draw();scrollTo({top:0,behavior:'smooth'})}function favorite(e,id){e.stopPropagation();fav.has(id)?fav.delete(id):fav.add(id);write(FAV,fav);draw()}function setMode(m){mode=mode===m?'':m;['favFilter','viewedFilter','unviewedFilter'].forEach(x=>$(x).classList.remove('active'));if(mode==='fav')$('favFilter').classList.add('active');if(mode==='seen')$('viewedFilter').classList.add('active');if(mode==='unseen')$('unviewedFilter').classList.add('active');filter()}
async function openPokemon(id){seen.add(id);write(VIEW,seen);draw();$('modal').classList.add('open');$('title').textContent='Carregando...';$('content').innerHTML='<div class="empty"><span class="spinner"></span>Buscando dados...</div>';try{let d=details.get(id);if(!d){d=await fetch(API+'/pokemon/'+id,{cache:'force-cache'}).then(r=>r.json());details.set(id,d)}const s=await fetch(API+'/pokemon-species/'+id,{cache:'force-cache'}).then(r=>r.json());let chain=null;try{chain=await fetch(s.evolution_chain.url,{cache:'force-cache'}).then(r=>r.json())}catch{}let evo=[];function walk(n){if(!n)return;evo.push(n.species.name);(n.evolves_to||[]).forEach(walk)}walk(chain?.chain);const types=d.types.map(x=>`<span class="chip">${esc(x.type.name)}</span>`).join(''),abilities=d.abilities.map(x=>`<span class="chip">${esc(x.ability.name)}</span>`).join(''),stats=d.stats.map(x=>`<div class="stat"><small>${esc(x.stat.name)}</small><b>${x.base_stat}</b></div>`).join('');$('title').textContent=`#${String(id).padStart(4,'0')} ${d.name}`;$('content').innerHTML=`<div class="detail"><img src="${img(id)}" onerror="imgFail(this,${id})"><div><h2>${esc(d.name)} ${fav.has(id)?'★':''}</h2><div class="chips">${types}</div><div class="stats">${stats}</div><p><b>Altura:</b> ${(d.height/10).toFixed(1)} m<br><b>Peso:</b> ${(d.weight/10).toFixed(1)} kg</p><h3>Habilidades</h3><div class="chips">${abilities}</div><h3>Linha evolutiva</h3><div class="evo">${evo.map((x,i)=>`<span class="evoItem">${esc(x)}</span>${i<evo.length-1?'→':''}`).join('')||'Não disponível'}</div><h3>Cartas TCG relacionadas</h3><div id="tcg" class="cards"><div class="empty"><span class="spinner"></span>Consultando...</div></div></div></div>`;loadTCG(d.name)}catch{$('content').innerHTML='<div class="empty">❌ Não foi possível carregar este Pokémon.</div>'}}
async function loadTCG(name){try{const r=await fetch(TCG+'?q='+encodeURIComponent('name:"'+name+'"')+'&pageSize=12',{cache:'no-store'});if(!r.ok)throw Error();const a=(await r.json()).data||[];$('tcg').innerHTML=a.length?a.map(c=>`<div class="tcg-card"><img src="${esc(c.images?.small||'')}" loading="lazy" alt="${esc(c.name)}"><small>${esc(c.set?.name||'')}</small></div>`).join(''):'<div class="empty">Nenhuma carta encontrada.</div>'}catch{$('tcg').innerHTML='<div class="empty">Cartas TCG indisponíveis no momento.</div>'}}
function close(){ $('modal').classList.remove('open') }let timer;function delayed(){clearTimeout(timer);timer=setTimeout(filter,120)}
$('q').oninput=delayed;$('gen').onchange=filter;$('type').onchange=filter;$('refresh').onclick=()=>load(true);$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('favFilter').onclick=()=>setMode('fav');$('viewedFilter').onclick=()=>setMode('seen');$('unviewedFilter').onclick=()=>setMode('unseen');$('clearMarks').onclick=()=>{if(confirm('Limpar favoritos e histórico de vistos?')){fav.clear();seen.clear();write(FAV,fav);write(VIEW,seen);mode='';filter()}};load();
</script></body></html>
