<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex Completa — O DIÁRIO TCG</title>
<style>
:root{--bg:#160704;--panel:#2a1008;--red:#d84324;--gold:#ffd044;--cream:#ffe9bd;--muted:#c99b6c;--line:#8e4b1c}
*{box-sizing:border-box}body{margin:0;background:#160704;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#5d240f,#2c1007);border:2px solid #a75b20;border-radius:16px;padding:20px;margin-bottom:16px}.toolbar{display:grid;grid-template-columns:minmax(220px,2fr) minmax(170px,1fr) minmax(170px,1fr) auto;gap:8px;align-items:center}.input,select{width:100%;background:#1d0b05;color:#fff;border:2px solid #8f4d1c;border-radius:9px;padding:11px}.btn{border:2px solid #ffc944;background:linear-gradient(#ef5530,#b92f1d);color:#fff;padding:10px 14px;border-radius:9px;font-weight:900;cursor:pointer;white-space:nowrap}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.secondary{background:#35170a;border-color:#9b5120}.btn.active{background:linear-gradient(#ffc933,#d98a0d);color:#1b0b04}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px;margin-top:16px}.poke{position:relative;background:#241007;border:2px solid #7d4218;border-radius:13px;overflow:hidden;cursor:pointer;content-visibility:auto;contain-intrinsic-size:250px}.poke:hover{transform:translateY(-2px);border-color:var(--gold)}.poke.viewed{border-color:#4e8d63}.img{height:190px;background:radial-gradient(circle,#713315,#1c0804 70%);display:flex;align-items:center;justify-content:center;position:relative}.img img{width:165px;height:165px;object-fit:contain}.img img.image-failed{display:none}.body{padding:10px}.num{color:#ffe4ad;font-size:12px}.name{font-weight:900;font-size:17px;text-transform:capitalize;margin-top:4px}.types{margin-top:7px;color:#ffe9bd;font-size:12px}.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;background:#204f32;color:#caffda;margin-top:6px}.fav{position:absolute;right:8px;top:8px;z-index:2;width:34px;height:34px;border:1px solid #c58b29;border-radius:50%;background:#1b0b05dd;color:#fff;font-size:18px;cursor:pointer}.fav.on{color:#ffd044;background:#5a280d}.empty{padding:40px;text-align:center;border:2px dashed var(--line);border-radius:13px;color:var(--muted)}.count{color:var(--muted);margin-top:10px}.pagination{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:20px 0}.page{min-width:38px;padding:9px 11px}.page.current{background:linear-gradient(#ffc933,#d98a0d);color:#1b0b04}.page-info{color:var(--muted);margin:0 10px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.box{width:min(1050px,100%);max-height:94vh;overflow:auto;background:#2b1208;border:2px solid var(--gold);border-radius:16px}.head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.content{padding:18px}.detail{display:grid;grid-template-columns:260px 1fr;gap:18px}.detail>img{width:100%;background:#1d0b05;border-radius:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#35170a;border:1px solid #9b5120;border-radius:999px;padding:6px 9px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#1d0b05;border:1px solid #7d4218;border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:8px}.evo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.evoItem{background:#35170a;border:1px solid #7d4218;border-radius:10px;padding:8px 10px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}.cards img{width:100%;height:190px;object-fit:contain;background:#e9ddc5;border-radius:8px}.tcg-card small{display:block;color:var(--muted);padding:4px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}
@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .input{grid-column:1/-1}.toolbar .btn{width:100%}}
@media(max-width:700px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.img{height:150px}.img img{width:135px;height:135px}.detail{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.toolbar .input{grid-column:auto}.page-info{width:100%;text-align:center;order:-1}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>📘 Pokédex Completa</h1><p>Explore os Pokémon, filtre por geração e tipo, marque favoritos e acompanhe quais você já visitou.</p></section>
<div class="toolbar">
<input id="q" class="input" placeholder="Buscar por nome ou número..." autocomplete="off">
<select id="gen"><option value="">Todas as gerações</option><option value="1">Geração 1 — Kanto</option><option value="2">Geração 2 — Johto</option><option value="3">Geração 3 — Hoenn</option><option value="4">Geração 4 — Sinnoh</option><option value="5">Geração 5 — Unova</option><option value="6">Geração 6 — Kalos</option><option value="7">Geração 7 — Alola</option><option value="8">Geração 8 — Galar</option><option value="9">Geração 9 — Paldea</option></select>
<select id="type"><option value="">Todos os tipos</option><option value="normal">Normal</option><option value="fire">Fogo</option><option value="water">Água</option><option value="electric">Elétrico</option><option value="grass">Grama</option><option value="ice">Gelo</option><option value="fighting">Lutador</option><option value="poison">Veneno</option><option value="ground">Terrestre</option><option value="flying">Voador</option><option value="psychic">Psíquico</option><option value="bug">Inseto</option><option value="rock">Pedra</option><option value="ghost">Fantasma</option><option value="dragon">Dragão</option><option value="dark">Sombrio</option><option value="steel">Aço</option><option value="fairy">Fada</option></select>
<button id="refresh" class="btn">↻ Atualizar</button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button id="favFilter" class="btn secondary">☆ Favoritos</button><button id="viewedFilter" class="btn secondary">✓ Já vistos</button><button id="unviewedFilter" class="btn secondary">○ Não vistos</button><button id="clearMarks" class="btn secondary">Limpar favoritos/vistos</button></div>
<div id="status" class="count"></div><div id="grid" class="grid"></div><div id="pagination" class="pagination"></div>
</div>
<div id="modal" class="modal"><div class="box"><div class="head"><b id="title">Pokémon</b><button class="btn" id="close">Fechar</button></div><div id="content" class="content"></div></div></div>
<script>
const API='https://pokeapi.co/api/v2';
const SPR='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
const SPRFALL='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const TCG='https://api.pokemontcg.io/v2/cards';
const CACHE='odtcg_pokedex_index_v2',DETAIL='odtcg_pokemon_detail_v1',FAV='odtcg_pokedex_favorites_v1',VIEW='odtcg_pokedex_viewed_v1';
const PAGE=48;
let list=[],filtered=[],page=1,detailCache=new Map(),typeMap=null,filterMode='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
const readSet=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||'[]').map(Number))}catch{return new Set()}};
const writeSet=(k,s)=>localStorage.setItem(k,JSON.stringify([...s]));
let favorites=readSet(FAV),viewed=readSet(VIEW);
function genOf(id){if(id<=151)return 1;if(id<=251)return 2;if(id<=386)return 3;if(id<=493)return 4;if(id<=649)return 5;if(id<=721)return 6;if(id<=809)return 7;if(id<=905)return 8;return 9}
function imageUrl(id){return SPR+id+'.png'}
function fallbackImage(img,id){const attempt=Number(img.dataset.imageAttempt||'0');if(attempt===0){img.dataset.imageAttempt='1';img.src=SPRFALL+id+'.png';return}img.classList.add('image-failed')}
async function loadIndex(force=false){
 $('status').innerHTML='<span class="spinner"></span>Carregando Pokédex...';$('grid').innerHTML='<div class="empty">🔄 Preparando a Pokédex...</div>';$('pagination').innerHTML='';
 try{let cached=!force?localStorage.getItem(CACHE):null;if(cached){const parsed=JSON.parse(cached);list=Array.isArray(parsed)?parsed:parsed.list||[]}if(!list.length||force){const r=await fetch(API+'/pokemon?limit=1025&offset=0',{cache:'force-cache'});if(!r.ok)throw Error();const j=await r.json();list=j.results.map((x,i)=>({id:i+1,name:x.name,gen:genOf(i+1)}));localStorage.setItem(CACHE,JSON.stringify({savedAt:Date.now(),list}))}$('status').textContent=list.length+' Pokémon disponíveis';render()}catch(e){$('status').textContent='Não foi possível carregar a Pokédex.';$('grid').innerHTML='<div class="empty">❌ Erro ao acessar a PokéAPI. Verifique sua conexão.</div>'}}
async function loadTypeMap(){
 if(typeMap)return typeMap;
 $('status').innerHTML='<span class="spinner"></span>Carregando filtro de tipos...';
 try{const types=[...$('type').options].map(o=>o.value).filter(Boolean);const entries=await Promise.all(types.map(async t=>{const key='odtcg_type_'+t;try{const c=localStorage.getItem(key);if(c)return [t,JSON.parse(c)]}catch{}const r=await fetch(API+'/type/'+t,{cache:'force-cache'});if(!r.ok)throw Error();const j=await r.json();const ids=j.pokemon.map(x=>Number(String(x.pokemon.url).match(/pokemon\/(\d+)\/?$/)?.[1])).filter(Boolean);try{localStorage.setItem(key,JSON.stringify(ids))}catch{}return [t,ids]}));typeMap=new Map(entries);return typeMap}catch(e){typeMap=null;throw e}
}
async function applyFilters(){
 const q=($('q').value||'').toLowerCase().trim(),g=$('gen').value,t=$('type').value;
 if(t){try{await loadTypeMap()}catch{$('status').textContent='Não foi possível carregar o filtro de tipos.';return}}
 const typeIds=t&&typeMap?new Set(typeMap.get(t)||[]):null;
 filtered=list.filter(p=>(!q||p.name.includes(q)||String(p.id)===q)&&(!g||String(p.gen)===g)&&(!typeIds||typeIds.has(p.id))&&(filterMode==='favorites'?favorites.has(p.id):filterMode==='viewed'?viewed.has(p.id):filterMode==='unviewed'?!viewed.has(p.id):true));
 const max=Math.max(1,Math.ceil(filtered.length/PAGE));if(page>max)page=max;draw();
}
function render(){page=1;applyFilters()}
function draw(){
 const start=(page-1)*PAGE,shown=filtered.slice(start,start+PAGE);
 $('grid').innerHTML=shown.length?shown.map(p=>{const isFav=favorites.has(p.id),isViewed=viewed.has(p.id);return `<article class="poke ${isViewed?'viewed':''}" onclick="openPokemon(${p.id})"><button class="fav ${isFav?'on':''}" title="${isFav?'Remover dos favoritos':'Adicionar aos favoritos'}" onclick="toggleFavorite(event,${p.id})">${isFav?'★':'☆'}</button><div class="img"><img src="${imageUrl(p.id)}" onerror="fallbackImage(this,${p.id})" loading="lazy" decoding="async" alt="${esc(p.name)}"></div><div class="body"><div class="num">#${String(p.id).padStart(4,'0')}</div><div class="name">${esc(p.name)}</div><div class="types">Geração ${p.gen}</div>${isViewed?'<span class="badge">✓ Já visto</span>':''}</div></article>`}).join(''):'<div class="empty">🔎 Nenhum Pokémon encontrado com esses filtros.</div>';
 const pages=Math.max(1,Math.ceil(filtered.length/PAGE));let html='';if(pages>1){html+=`<button class="btn page" ${page===1?'disabled':''} onclick="goPage(${page-1})">‹</button>`;const nums=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-page)<=2)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…')}html+=nums.map(n=>n==='…'?'<span class="page-info">…</span>':`<button class="btn page ${n===page?'current':''}" onclick="goPage(${n})">${n}</button>`).join('');html+=`<button class="btn page" ${page===pages?'disabled':''} onclick="goPage(${page+1})">›</button>`} $('pagination').innerHTML=html;
 $('status').textContent=`${filtered.length} Pokémon encontrados • página ${page}/${pages} • ${favorites.size} favoritos • ${viewed.size} vistos`;
}
function goPage(n){const pages=Math.max(1,Math.ceil(filtered.length/PAGE));page=Math.max(1,Math.min(pages,n));draw();window.scrollTo({top:0,behavior:'smooth'})}
function toggleFavorite(e,id){e.stopPropagation();if(favorites.has(id))favorites.delete(id);else favorites.add(id);writeSet(FAV,favorites);draw()}
function setMode(mode){filterMode=filterMode===mode?'':mode;['favFilter','viewedFilter','unviewedFilter'].forEach(id=>$(id).classList.remove('active'));if(filterMode==='favorites')$('favFilter').classList.add('active');if(filterMode==='viewed')$('viewedFilter').classList.add('active');if(filterMode==='unviewed')$('unviewedFilter').classList.add('active');render()}
async function getDetail(id){if(detailCache.has(id))return detailCache.get(id);const key=DETAIL+'_'+id;try{const cached=sessionStorage.getItem(key);if(cached){const d=JSON.parse(cached);detailCache.set(id,d);return d}}catch{}const r=await fetch(API+'/pokemon/'+id,{cache:'force-cache'});if(!r.ok)throw Error();const d=await r.json();detailCache.set(id,d);try{sessionStorage.setItem(key,JSON.stringify(d))}catch{}return d}
async function getSpecies(id){const key=DETAIL+'_species_'+id;try{const c=sessionStorage.getItem(key);if(c)return JSON.parse(c)}catch{}const r=await fetch(API+'/pokemon-species/'+id,{cache:'force-cache'});if(!r.ok)throw Error();const s=await r.json();try{sessionStorage.setItem(key,JSON.stringify(s))}catch{}return s}
async function openPokemon(id){
 viewed.add(id);writeSet(VIEW,viewed);draw();$('modal').classList.add('open');$('title').textContent='Carregando...';$('content').innerHTML='<div class="empty"><span class="spinner"></span>Buscando dados do Pokémon...</div>';
 try{const d=await getDetail(id),s=await getSpecies(id),types=d.types.map(x=>x.type.name),stats=d.stats.map(x=>`<div class="stat"><small>${esc(x.stat.name)}</small><b>${x.base_stat}</b></div>`).join('');let evo='';try{const key=DETAIL+'_evo_'+id;let ec;try{ec=JSON.parse(sessionStorage.getItem(key)||'null')}catch{}if(!ec){ec=await fetch(s.evolution_chain.url,{cache:'force-cache'}).then(r=>r.json());try{sessionStorage.setItem(key,JSON.stringify(ec))}catch{}}const out=[];function walk(n){out.push(n.species.name);(n.evolves_to||[]).forEach(walk)}walk(ec.chain);evo=out.map((n,i)=>`<span class="evoItem">${esc(n)}</span>${i<out.length-1?'<span>→</span>':''}`).join('')}catch{}const abilities=d.abilities.map(a=>`<span class="chip">${esc(a.ability.name)}</span>`).join('');$('title').textContent=`#${String(id).padStart(4,'0')} ${d.name}`;$('content').innerHTML=`<div class="detail"><img src="${imageUrl(id)}" onerror="fallbackImage(this,${id})" loading="eager"><div><h2>${esc(d.name)} ${favorites.has(id)?'★':''}</h2><div class="chips">${types.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="stats">${stats}</div><p><b>Altura:</b> ${(d.height/10).toFixed(1)} m<br><b>Peso:</b> ${(d.weight/10).toFixed(1)} kg</p><h3>Habilidades</h3><div class="chips">${abilities}</div><h3>Linha evolutiva</h3><div class="evo">${evo||'Não disponível'}</div><h3>Cartas TCG relacionadas</h3><div id="tcg" class="cards"><div class="empty"><span class="spinner"></span>Consultando cartas...</div></div></div></div>`;loadTCG(d.name)}catch(e){$('content').innerHTML='<div class="empty">❌ Não foi possível carregar os dados desse Pokémon.</div>'}}
async function loadTCG(name){const el=$('tcg');try{const q=encodeURIComponent('name:"'+name+'"');const r=await fetch(TCG+'?q='+q+'&pageSize=12',{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json(),arr=(j.data||[]).slice(0,12);el.innerHTML=arr.length?arr.map(c=>`<div class="tcg-card"><img src="${esc(c.images?.small||'')}" loading="lazy" decoding="async" alt="${esc(c.name)}"><small>${esc(c.set?.name||'')}</small></div>`).join(''):'<div class="empty">Nenhuma carta encontrada para este Pokémon.</div>'}catch{el.innerHTML='<div class="empty">Cartas TCG indisponíveis no momento.</div>'}}
function closeModal(){$('modal').classList.remove('open')}
let timer;function scheduleRender(){clearTimeout(timer);timer=setTimeout(render,120)}
$('q').addEventListener('input',scheduleRender);$('gen').addEventListener('change',render);$('type').addEventListener('change',()=>{page=1;applyFilters()});$('refresh').addEventListener('click',()=>loadIndex(true));$('close').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});$('favFilter').addEventListener('click',()=>setMode('favorites'));$('viewedFilter').addEventListener('click',()=>setMode('viewed'));$('unviewedFilter').addEventListener('click',()=>setMode('unviewed'));$('clearMarks').addEventListener('click',()=>{if(confirm('Limpar favoritos e histórico de vistos?')){favorites.clear();viewed.clear();writeSet(FAV,favorites);writeSet(VIEW,viewed);filterMode='';render()}});
loadIndex();
</script>
</body>
</html>
