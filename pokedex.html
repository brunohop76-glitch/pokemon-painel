<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex Completa — O DIÁRIO TCG</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160704;color:#fff2d6;font-family:Arial,Inter,sans-serif}
.toolbar{height:64px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(180deg,#351207,#1d0804);border-bottom:3px solid #ffbf27;box-shadow:0 4px 16px #0008;position:relative;z-index:10}
.back{border:2px solid #ffbf27;background:linear-gradient(135deg,#d83b1e,#f07818);color:#fff8e9;border-radius:10px;padding:10px 16px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px #0006}
.back:hover{filter:brightness(1.12);transform:translateY(-1px)}
.title{font-weight:900;font-size:18px;color:#fff4dc}.title span{color:#ffbf27}
.hint{margin-left:auto;color:#d3a06a;font-size:12px;font-weight:700}
.frame{width:100%;height:calc(100vh - 64px);border:0;display:block;background:#160704}
@media(max-width:650px){.toolbar{height:58px;padding:8px 10px}.back{padding:9px 12px;font-size:13px}.title{font-size:15px}.hint{display:none}.frame{height:calc(100vh - 58px)}}
</style>
</head>
<body>
<header class="toolbar">
<button class="back" onclick="goHome()">← Voltar ao Painel</button>
<div class="title">O DIÁRIO <span>TCG</span> · Pokédex Completa</div>
<div class="hint">Clique em um Pokémon para abrir a ficha completa · / buscar · Esc fechar</div>
</header>
<iframe id="pokedexFrame" class="frame" src="pokedex-original.html?v=20260819-1" title="Pokédex Completa"></iframe>
<script>
function goHome(){window.location.href='index.html?v=20260819-3'}

const frame=document.getElementById('pokedexFrame');

frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    doc.addEventListener('click',event=>{
      const card=event.target.closest('.poke');
      if(!card)return;
      const match=card.getAttribute('onclick')?.match(/openPokemon\((\d+)\)/);
      if(!match)return;
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      window.location.href='pokemon.html?id='+match[1];
    },true);
  }catch(e){
    console.warn('Não foi possível integrar a navegação da Pokédex.',e);
  }
});
</script>
<script src="pokedex-redesign.js?v=20260819-1"></script>
</body>
</html>
