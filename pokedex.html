<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokédex Completa — O DIÁRIO TCG</title><style>:root{--bg:#160704;--panel:#2a1008;--red:#d84324;--gold:#ffd044;--cream:#ffe9bd;--muted:#c99b6c;--line:#8e4b1c}*{box-sizing:border-box}body{margin:0;background:#160704;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#5d240f,#2c1007);border:2px solid #a75b20;border-radius:16px;padding:20px;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.input,select{flex:1;min-width:220px;background:#1d0b05;color:#fff;border:2px solid #8f4d1c;border-radius:9px;padding:11px}.btn{border:2px solid #ffc944;background:linear-gradient(#ef5530,#b92f1d);color:#fff;padding:10px 14px;border-radius:9px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px;margin-top:16px}.poke{background:#241007;border:2px solid #7d4218;border-radius:13px;overflow:hidden;cursor:pointer}.img{height:190px;background:radial-gradient(circle,#713315,#1c0804 70%);display:flex;align-items:center;justify-content:center}.img img{width:165px;height:165px;object-fit:contain}.body{padding:10px}.num{color:#ffe4ad;font-size:12px}.name{font-weight:900;font-size:17px;text-transform:capitalize;margin-top:4px}.types{margin-top:7px;color:#ffe9bd;font-size:12px}.empty{padding:40px;text-align:center;border:2px dashed var(--line);border-radius:13px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.box{width:min(1050px,100%);max-height:94vh;overflow:auto;background:#2b1208;border:2px solid var(--gold);border-radius:16px}.head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.content{padding:18px}.detail{display:grid;grid-template-columns:260px 1fr;gap:18px}.detail>img{width:100%;background:#1d0b05;border-radius:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#35170a;border:1px solid #9b5120;border-radius:999px;padding:6px 9px;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#1d0b05;border:1px solid #7d4218;border-radius:10px;padding:10px}.evo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.evoItem{background:#35170a;border:1px solid #7d4218;border-radius:10px;padding:8px 10px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}.cards img{width:100%;height:190px;object-fit:contain;background:#e9ddc5;border-radius:8px}@media(max-width:700px){.detail{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><section class="hero"><h1>📘 Pokédex Completa</h1><p>Dados de Pokémon usando a PokéAPI. Pesquise qualquer Pokémon e veja tipos, habilidades, evolução e cartas TCG relacionadas.</p></section><div class="toolbar"><input id="q" class="input" placeholder="Buscar por nome ou número..." autocomplete="off"><select id="gen"><option value="">Todas as gerações</option><option value="1">Geração 1 — Kanto</option><option value="2">Geração 2 — Johto</option><option value="3">Geração 3 — Hoenn</option><option value="4">Geração 4 — Sinnoh</option><option value="5">Geração 5 — Unova</option><option value="6">Geração 6 — Kalos</option><option value="7">Geração 7 — Alola</option><option value="8">Geração 8 — Galar</option><option value="9">Geração 9 — Paldea</option></select><button class="btn" onclick="loadIndex(true)">↻ Atualizar</button></div><div id="status" style="margin-top:10px;color:#c99b6c"></div><div id="grid" class="grid"></div></div><div id="modal" class="modal"><div class="box"><div class="head"><b id="title">Pokémon</b><button class="btn" onclick="closeModal()">Fechar</button></div><div id="content" class="content"></div></div></div><script>const API='https://pokeapi.co/api/v2',SPR='https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/';const SPRFALL='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';const TCG='https://cdn.jsdelivr.net/gh/PokemonTCG/pokemon-tcg-data@master';let list=[],detailCache=new Map;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function genOf(id){if(id<=151)return 1;if(id<=251)return 2;if(id<=386)return 3;if(id<=493)return 4;if(id<=649)return 5;if(id<=721)return 6;if(id<=809)return 7;if(id<=905)return 8;return 9}async function loadIndex(force=false){$('status').textContent='Carregando Pokédex...';$('grid').innerHTML='<div class="empty">🔄 Conectando à PokéAPI...</div>';try{let cached=!force?localStorage.getItem('odtcg_pokedex_index'):null;if(cached){list=JSON.parse(cached)}else{const r=await fetch(API+'/pokemon?limit=1025&offset=0',{cache:'force-cache'});const j=await r.json();list=j.results.map((x,i)=>({id:i+1,name:x.name,url:x.url,gen:genOf(i+1)}));localStorage.setItem('odtcg_pokedex_index',JSON.stringify(list))}$('status').textContent=list.length+' Pokémon carregados';render()}catch(e){$('status').textContent='Não foi possível carregar a Pokédex.';$('grid').innerHTML='<div class="empty">❌ Erro ao acessar a PokéAPI.</div>'}}function imageUrl(id){return SPR+id+'.png'}function fallbackImage(img,id){if(img.dataset.fallback)return;img.dataset.fallback='1';img.src=SPRFALL+id+'.png'}function render(){const q=($('q').value||'').toLowerCase().trim(),g=$('gen').value;const arr=list.filter(p=>(!q||p.name.includes(q)||String(p.id)===q)&&(!g||String(p.gen)===g));const shown=arr.slice(0,120);$('grid').innerHTML=shown.length?shown.map(p=>`<article class="poke" onclick="openPokemon(${p.id})"><div class="img"><img src="${imageUrl(p.id)}" onerror="fallbackImage(this,${p.id})" loading="lazy" decoding="async" alt="${esc(p.name)}"></div><div class="body"><div class="num">#${String(p.id).padStart(4,'0')}</div><div class="name">${esc(p.name)}</div><div class="types" id="types-${p.id}">Carregando tipos...</div></div></article>`).join(''):'<div class="empty">Nenhum Pokémon encontrado.</div>';shown.slice(0,30).forEach(p=>loadMiniType(p))}async function loadMiniType(p){if(detailCache.has(p.id)){setType(p.id,detailCache.get(p.id).types||[]);return}try{const j=await fetch(API+'/pokemon/'+p.id,{cache:'force-cache'}).then(r=>r.json());const types=j.types.map(t=>t.type.name);detailCache.set(p.id,{...j,types});setType(p.id,types)}catch{setType(p.id,[])}}function setType(id,types){const el=document.getElementById('types-'+id);if(el)el.textContent=types.length?types.join(' • '):''}async function openPokemon(id){$('modal').classList.add('open');$('title').textContent='Carregando...';$('content').innerHTML='<div class="empty">🔄 Buscando dados do Pokémon...</div>';try{const d=detailCache.get(id)||await fetch(API+'/pokemon/'+id,{cache:'force-cache'}).then(r=>r.json());detailCache.set(id,d);const s=await fetch(API+'/pokemon-species/'+id,{cache:'force-cache'}).then(r=>r.json());$('title').textContent=`#${String(id).padStart(4,'0')} ${d.name}`;const types=d.types.map(x=>x.type.name),stats=d.stats.map(x=>`<div class="stat"><small>${esc(x.stat.name)}</small><b>${x.base_stat}</b></div>`).join('');let evo='';try{const ec=await fetch(s.evolution_chain.url,{cache:'force-cache'}).then(r=>r.json());const out=[];function walk(n){out.push(n.species.name);(n.evolves_to||[]).forEach(walk)}walk(ec.chain);evo=out.map((n,i)=>`<span class="evoItem">${esc(n)}</span>${i<out.length-1?'<span>→</span>':''}`).join('')}catch{}const abilities=d.abilities.map(a=>`<span class="chip">${esc(a.ability.name)}</span>`).join('');$('content').innerHTML=`<div class="detail"><img src="${imageUrl(id)}" onerror="fallbackImage(this,${id})"><div><h2>${esc(d.name)}</h2><div class="chips">${types.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><div class="stats">${stats}</div><p><b>Altura:</b> ${(d.height/10).toFixed(1)} m<br><b>Peso:</b> ${(d.weight/10).toFixed(1)} kg</p><h3>Habilidades</h3><div class="chips">${abilities}</div><h3>Linha evolutiva</h3><div class="evo">${evo||'Não disponível'}</div><h3>Cartas TCG relacionadas</h3><div id="tcg" class="cards"><div class="empty">🔎 Procurando cartas...</div></div></div></div>`;loadTCG(d.name)}catch(e){$('content').innerHTML='<div class="empty">❌ Não foi possível carregar os dados desse Pokémon.</div>'}}async function loadTCG(name){const el=$('tcg');try{const r=await fetch(TCG+'/cards/en.json',{cache:'force-cache'});if(!r.ok)throw Error();const all=await r.json();const arr=all.filter(c=>String(c.name||'').toLowerCase()===name.toLowerCase()).slice(0,12);el.innerHTML=arr.length?arr.map(c=>`<div><img src="${esc(c.images?.small||'')}" loading="lazy" alt="${esc(c.name)}"><small>${esc(c.set?.name||'')}</small></div>`).join(''):'<div class="empty">Nenhuma carta encontrada para este Pokémon.</div>'}catch{el.innerHTML='<div class="empty">Não foi possível consultar as cartas agora.</div>'}}function closeModal(){$('modal').classList.remove('open')}$('q').addEventListener('input',render);$('gen').addEventListener('change',render);loadIndex();</script></body></html>
