<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O DIÁRIO TCG - Pokédex Kanto</title><style>*{box-sizing:border-box}body{margin:0;background:#09030d;color:#f7efff;font-family:Arial,sans-serif}.wrap{min-height:100vh;padding:30px;background:radial-gradient(circle at 80% 0,#42065c,transparent 35%),#09030d}.top{max-width:1500px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:24px;font-weight:900}.brand span{color:#bd62ff}.hero{max-width:1500px;margin:25px auto 18px;padding:24px;border:1px solid #6c258a;border-radius:20px;background:linear-gradient(135deg,#180621,#32094a)}h1{margin:0 0 6px}.sub{color:#b99cc3}.progress{height:12px;background:#24112d;border-radius:99px;overflow:hidden;margin-top:15px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#a43ff0,#e66bff)}.tools{max-width:1500px;margin:0 auto 18px;display:flex;gap:9px;flex-wrap:wrap}.tools input{flex:1;min-width:250px;background:#120719;border:1px solid #602275;color:white;border-radius:10px;padding:12px}.tools button{border:1px solid #542064;background:#15091c;color:#dcb6e9;border-radius:9px;padding:9px 12px;cursor:pointer}.tools button.active{background:#8e39c7;color:#fff}.grid{max-width:1500px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}.pokemon{background:#13071a;border:1px solid #432052;border-radius:15px;overflow:hidden}.pokemon.owned{border-color:#27c986;box-shadow:0 0 0 1px #27c98633}.img{height:150px;background:radial-gradient(circle,#35104a,#100613 70%);position:relative;display:flex;align-items:center;justify-content:center}.img img{width:135px;height:135px;object-fit:contain}.pokemon:not(.owned) img{filter:grayscale(1) brightness(.42);opacity:.7}.num{position:absolute;left:8px;top:8px;color:#a88caf;font-size:10px;font-weight:bold}.mark{position:absolute;right:7px;top:7px;background:#18a96d;color:white;border-radius:99px;padding:4px 6px;font-size:9px;display:none}.owned .mark{display:block}.body{padding:9px}.name{text-transform:capitalize;font-weight:bold}.status{font-size:11px;color:#9f84aa;margin-top:3px}.body button{width:100%;margin-top:8px;border:1px solid #603078;background:#1d0b27;color:#dcb6e9;border-radius:8px;padding:7px;font-size:10px;cursor:pointer}.owned .body button{background:#123b2c;border-color:#208c62;color:#9dffd2}@media(max-width:600px){.wrap{padding:15px}.grid{grid-template-columns:repeat(3,1fr);gap:7px}.img{height:105px}.img img{width:95px;height:95px}.body{padding:7px}.name{font-size:11px}.status{font-size:9px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">🃏 O DIÁRIO <span>TCG</span></div><div id="count">0 / 151</div></div><div class="hero"><h1>🔴 Pokédex Kanto</h1><div class="sub">Marque os 151 Pokémon que você já possui na coleção.</div><div class="progress"><span id="bar" style="width:0"></span></div></div><div class="tools"><input id="search" placeholder="🔎 Procurar Pokémon..." oninput="render()"><button id="all" class="active" onclick="view='all';buttons();render()">Todos</button><button id="owned" onclick="view='owned';buttons();render()">Tenho</button><button id="missing" onclick="view='missing';buttons();render()">Faltam</button><button onclick="clearMarks()">↺ Limpar marcações</button></div><div id="grid" class="grid"></div></div><script>const P=['Bulbasaur','Ivysaur','Venusaur','Charmander','Charmeleon','Charizard','Squirtle','Wartortle','Blastoise','Caterpie','Metapod','Butterfree','Weedle','Kakuna','Beedrill','Pidgey','Pidgeotto','Pidgeot','Rattata','Raticate','Spearow','Fearow','Ekans','Arbok','Pikachu','Raichu','Sandshrew','Sandslash','Nidoran♀','Nidorina','Nidoqueen','Nidoran♂','Nidorino','Nidoking','Clefairy','Clefable','Vulpix','Ninetales','Jigglypuff','Wigglytuff','Zubat','Golbat','Oddish','Gloom','Vileplume','Paras','Parasect','Venonat','Venomoth','Diglett','Dugtrio','Meowth','Persian','Psyduck','Golduck','Mankey','Primeape','Growlithe','Arcanine','Poliwag','Poliwhirl','Poliwrath','Abra','Kadabra','Alakazam','Machop','Machoke','Machamp','Bellsprout','Weepinbell','Victreebel','Tentacool','Tentacruel','Geodude','Graveler','Golem','Ponyta','Rapidash','Slowpoke','Slowbro','Magnemite','Magneton','Farfetchd','Doduo','Dodrio','Seel','Dewgong','Grimer','Muk','Shellder','Cloyster','Gastly','Haunter','Gengar','Onix','Drowzee','Hypno','Krabby','Kingler','Voltorb','Electrode','Exeggcute','Exeggutor','Cubone','Marowak','Hitmonlee','Hitmonchan','Lickitung','Koffing','Weezing','Rhyhorn','Rhydon','Chansey','Tangela','Kangaskhan','Horsea','Seadra','Goldeen','Seaking','Staryu','Starmie','Mr Mime','Scyther','Jynx','Electabuzz','Magmar','Pinsir','Tauros','Magikarp','Gyarados','Lapras','Ditto','Eevee','Vaporeon','Jolteon','Flareon','Porygon','Omanyte','Omastar','Kabuto','Kabutops','Aerodactyl','Snorlax','Articuno','Zapdos','Moltres','Dratini','Dragonair','Dragonite','Mewtwo','Mew'];let view='all';const KEY='odtcg_kanto_151';const get=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]').map(Number)}catch(e){return[]}};const save=a=>localStorage.setItem(KEY,JSON.stringify([...new Set(a)]));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function buttons(){document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('active'));document.getElementById(view).classList.add('active')}function toggle(id){let a=get();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];save(a);render()}function clearMarks(){if(confirm('Limpar todas as marcações?')){localStorage.removeItem(KEY);render()}}function render(){let a=get(),q=document.getElementById('search').value.toLowerCase();document.getElementById('count').textContent=a.length+' / 151';document.getElementById('bar').style.width=(a.length/151*100)+'%';let list=P.map((name,i)=>({name,id:i+1,own:a.includes(i+1)})).filter(x=>(!q||x.name.toLowerCase().includes(q)||String(x.id).includes(q))&&(view==='all'||view==='owned'&&x.own||view==='missing'&&!x.own));document.getElementById('grid').innerHTML=list.map(x=>'<article class="pokemon '+(x.own?'owned':'')+'"><div class="img"><span class="num">#'+String(x.id).padStart(3,'0')+'</span><span class="mark">✓ TENHO</span><img loading="lazy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+x.id+'.png" alt="'+esc(x.name)+'"></div><div class="body"><div class="name">'+esc(x.name)+'</div><div class="status">'+(x.own?'Na coleção':'Ainda não tenho')+'</div><button onclick="toggle('+x.id+')">'+(x.own?'✓ Marcar como faltando':'＋ Marcar como tenho')+'</button></div></article>').join('')}render();</script></body></html>
