<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Coleção TCG</title><style>body{margin:0;background:#160704;color:#fff;font:16px Arial}main{max-width:1400px;margin:auto;padding:24px}.box{background:#2b1007;border:2px solid #a75b20;border-radius:14px;padding:18px}a,button{background:#d84324;color:#fff;border:2px solid #ffd044;border-radius:9px;padding:10px 14px;font-weight:900;text-decoration:none;cursor:pointer}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#190805;border:1px solid #874717;border-radius:10px;padding:12px;min-width:130px}.stat b{display:block;color:#ffd044;font-size:22px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.card{background:#230b05;border:2px solid #874717;border-radius:12px;overflow:hidden}.card img{width:100%;height:250px;object-fit:contain;background:#eadfc9}.body{padding:10px}.muted{color:#c99b6c}.qty{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.qty button{padding:4px 10px}.empty{text-align:center;padding:50px;border:2px dashed #874717;color:#c99b6c}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.card img{height:205px}}</style><main><div class="box"><h1>📚 Minha Coleção Pokémon TCG</h1><p class="muted">Gerencie suas cartas, quantidades e valor estimado.</p><div class="bar"><a href="index.html">← Painel</a><a href="cartas.html">🃏 Catálogo TCG</a></div><div class="stats"><div class="stat">Cartas diferentes<b id="d">0</b></div><div class="stat">Unidades<b id="u">0</b></div><div class="stat">Valor<b id="v">R$ 0,00</b></div></div></div><div class="bar"><input id="q" placeholder="Buscar..." style="flex:1;padding:11px;background:#190805;color:#fff;border:2px solid #874717;border-radius:9px"><button id="clear">Limpar</button></div><div id="grid" class="grid"></div></main><script>const K='odtcg_collection_v1';let a=[];try{a=JSON.parse(localStorage.getItem(K)||'[]')}catch{};const $=x=>document.getElementById(x);function save(){localStorage.setItem(K,JSON.stringify(a));render()}function change(id,n){let x=a.find(c=>c.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)a=a.filter(c=>c.id!==id);save()}function render(){let q=$('q').value.toLowerCase();let b=a.filter(c=>c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q));$('d').textContent=a.length;$('u').textContent=a.reduce((s,c)=>s+c.qty,0);$('v').textContent=a.reduce((s,c)=>s+(Number(c.price)||0)*c.qty,0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});$('grid').innerHTML=b.length?b.map(c=>`<article class="card"><img src="${c.image}" loading="lazy"><div class="body"><b>${c.name}</b><div class="muted">${c.id} • ${c.set||''}</div><div class="qty"><button onclick="change('${c.id}',-1)">−</button><b>${c.qty} un.</b><button onclick="change('${c.id}',1)">+</button></div></div></article>`).join(''):'<div class="empty">📦 Nenhuma carta na coleção.<br><br>Abra o Catálogo TCG para adicionar cartas.</div>'}$('q').oninput=render;$('clear').onclick=()=>{if(confirm('Limpar toda a coleção?')){a=[];save()}};render()</script></html>
