<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Coleção TCG — O DIÁRIO TCG</title><style>:root{--bg:#160704;--panel:#2b1007;--panel2:#3a1609;--gold:#ffd044;--orange:#a75b20;--red:#df4824;--cream:#ffe9bd;--muted:#c99b6c;--line:#874717}*{box-sizing:border-box}body{margin:0;background:repeating-linear-gradient(0deg,#160704 0,#160704 3px,#190805 3px,#190805 5px);color:#fff;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:5;padding:10px 16px;background:#260c05;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;gap:10px}.btn{border:2px solid var(--gold);background:linear-gradient(#ef5530,#b92f1d);color:#fff;padding:9px 13px;border-radius:9px;font-weight:900;cursor:pointer;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:18px}.hero,.panel{background:linear-gradient(135deg,#4a1b0b,#260c06);border:2px solid var(--orange);border-radius:15px;padding:18px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:var(--cream)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.stat{min-width:150px;background:#1e0a05;border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{display:block;font-size:22px;color:var(--gold)}.filters{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:14px}.input,select{width:100%;background:#190805;color:#fff;border:2px solid #8f4d1c;border-radius:9px;padding:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{background:linear-gradient(#351309,#210a05);border:2px solid var(--line);border-radius:12px;overflow:hidden}.card img{display:block;width:100%;height:250px;object-fit:contain;background:#eadfc9}.body{padding:10px}.name{font-weight:900;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.qty button{border:1px solid var(--gold);background:#35170a;color:#fff;border-radius:7px;width:30px;height:30px;font-weight:900;cursor:pointer}.empty{text-align:center;padding:50px;color:var(--muted);border:2px dashed var(--line);border-radius:12px}.danger{background:#6e1d10;border-color:#d84724}@media(max-width:700px){.filters{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card img{height:210px}}</style></head><body><header class="top"><a class="btn" href="index.html">← Painel</a><a class="btn" href="cartas.html">🃏 Catálogo TCG</a></header><main class="wrap"><section class="hero"><h1>📚 Minha Coleção Pokémon TCG</h1><p>Organize suas cartas, acompanhe quantidades e veja o valor estimado do acervo.</p></section><div class="stats"><div class="stat">Cartas diferentes<b id="different">0</b></div><div class="stat">Unidades<b id="units">0</b></div><div class="stat">Valor estimado<b id="value">R$ 0,00</b></div></div><section class="panel"><div class="filters"><input id="q" class="input" placeholder="Buscar carta, número ou Pokémon..." autocomplete="off"><select id="sort"><option value="name">Nome</option><option value="price">Maior valor</option><option value="qty">Maior quantidade</option></select><button class="btn danger" id="clear">Limpar coleção</button></div><div id="grid" class="grid"><div class="empty">Carregando coleção...</div></div></section></main><script>const KEY='odtcg_collection_v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}function add(card){const old=items.find(x=>x.id===card.id);if(old)old.qty++;else items.push({...card,qty:1});save()}function remove(id){const x=items.find(c=>c.id===id);if(!x)return;if(x.qty>1)x.qty--;else items=items.filter(c=>c.id!==id);save()}function render(){const q=$('q').value.toLowerCase().trim();let a=items.filter(c=>!q||c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)||(c.set||'').toLowerCase().includes(q));const s=$('sort').value;a.sort((x,y)=>s==='price'?(y.price||0)-(x.price||0):s==='qty'?y.qty-x.qty:x.name.localeCompare(y.name));$('different').textContent=items.length;$('units').textContent=items.reduce((n,x)=>n+x.qty,0);$('value').textContent=items.reduce((n,x)=>n+(Number(x.price)||0)*x.qty,0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});$('grid').innerHTML=a.length?a.map(c=>`<article class="card"><img loading="lazy" src="${esc(c.image)}" alt="${esc(c.name)}"><div class="body"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.id)} • ${esc(c.set||'')}</div><div class="qty"><button onclick='remove(${JSON.stringify(c.id)})'>−</button><b>${c.qty} un.</b><button onclick='add(${JSON.stringify(c)})'>+</button></div></div></article>`).join(''):'<div class="empty">📦 Sua coleção está vazia.<br><br>Abra o Catálogo TCG e use <b>Adicionar à coleção</b> nas cartas.</div>'}$('q').oninput=render;$('sort').onchange=render;$('clear').onclick=()=>{if(confirm('Apagar toda a coleção deste navegador?')){items=[];save()}};render();</script></body></html>
