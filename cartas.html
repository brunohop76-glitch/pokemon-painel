<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartas TCG — O DIÁRIO TCG</title><style>:root{--bg:#160704;--panel:#2a1008;--panel2:#3a1608;--red:#d84324;--gold:#ffd044;--cream:#ffe9bd;--muted:#c99b6c;--line:#8e4b1c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#1b0804,#351207 55%,#160603);color:#fff;font-family:Arial,sans-serif}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#260c05;border-bottom:3px solid var(--gold)}button,input,select{font:inherit}.btn{border:2px solid #ffc944;background:linear-gradient(#ef5530,#b92f1d);color:#fff;padding:10px 14px;border-radius:9px;font-weight:900;cursor:pointer}.btn.secondary{background:#35170a;border-color:#9b5120}.wrap{max-width:1600px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#5d240f,#2c1007);border:2px solid #a75b20;border-radius:16px;padding:18px;margin-bottom:14px}.hero h1{margin:0 0 6px}.hero p{margin:0;color:var(--cream)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:10px}.input,select{width:100%;background:#1d0b05;color:#fff;border:2px solid #8f4d1c;border-radius:9px;padding:11px}.status{color:var(--muted);margin:8px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}.card{background:linear-gradient(180deg,#3a1608,#230b05);border:2px solid #7d4218;border-radius:13px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{border-color:var(--gold);transform:translateY(-2px)}.img{height:260px;background:#241007;display:flex;align-items:center;justify-content:center}.img img{width:100%;height:100%;object-fit:contain}.body{padding:10px}.name{font-weight:900;font-size:16px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.tag{display:inline-block;margin-top:7px;padding:4px 7px;border-radius:999px;background:#b93117;color:#fff;font-size:10px;font-weight:900}.empty{padding:45px;text-align:center;border:2px dashed var(--line);border-radius:13px;color:var(--muted)}.pagination{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:18px 0}.page{min-width:38px}.page.active{background:linear-gradient(#ffc933,#d98a0d);color:#1b0b04}@media(max-width:950px){.filters{grid-template-columns:1fr 1fr}.filters .searchbox{grid-column:1/-1}}@media(max-width:650px){.top{padding:8px 10px}.top .title{font-size:14px}.wrap{padding:10px}.filters{grid-template-columns:1fr}.img{height:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}</style></head><body><header class="top"><button class="btn" onclick="location.href='index.html?v=20260817-6'">← Painel</button><div class="title"><b>🃏 Cartas TCG</b></div></header><main class="wrap"><section class="hero"><h1>🃏 Cartas Pokémon TCG</h1><p>Catálogo de cartas baseado no repositório oficial de dados Pokémon TCG. As imagens e dados são carregados sob demanda para manter o sistema leve.</p></section><div class="filters"><input id="q" class="input searchbox" placeholder="Buscar carta, número ou Pokémon..." autocomplete="off"><select id="set"><option value="">Todos os sets</option></select><select id="rarity"><option value="">Todas as raridades</option></select><select id="type"><option value="">Todos os tipos</option></select><button id="refresh" class="btn">↻ Atualizar</button></div><div class="status" id="status">Carregando catálogo…</div><div class="grid" id="grid"></div><div class="pagination" id="pagination"></div></main><script>const DATA='https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master/cards/en/';const IMG='https://images.pokemontcg.io/';const PAGE=60;const KEY='odtcg_cards_catalog_v1';let all=[],filtered=[],page=1,sets=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function load(){ $('status').textContent='Carregando sets…';try{const tree=await fetch('https://api.github.com/repos/PokemonTCG/pokemon-tcg-data/git/trees/master?recursive=1').then(r=>r.json());const files=(tree.tree||[]).map(x=>x.path).filter(p=>/^cards\/en\/[^/]+\.json$/.test(p));sets=files.map(p=>({code:p.split('/').pop().replace('.json',''),path:p}));fillSets();const cached=localStorage.getItem(KEY);if(cached){all=JSON.parse(cached)}else{all=[]}render();$('status').textContent=all.length?'Catálogo pronto. Digite uma busca para carregar cartas.':'Catálogo conectado. As cartas serão carregadas quando você buscar um set.'}catch(e){$('status').textContent='Não foi possível acessar o catálogo online.'}}
function fillSets(){ $('set').innerHTML='<option value="">Todos os sets</option>'+sets.map(s=>`<option value="${esc(s.code)}">${esc(s.code.toUpperCase())}</option>`).join('')}
async function loadSet(code){const s=sets.find(x=>x.code===code);if(!s)return;const r=await fetch('https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master/'+s.path,{cache:'force-cache'});if(!r.ok)throw Error();const data=await r.json();const map=new Map(all.map(c=>[c.id,c]));data.forEach(c=>map.set(c.id,{...c,setCode:code}));all=[...map.values()];try{localStorage.setItem(KEY,JSON.stringify(all))}catch{}populateFilters();}
function populateFilters(){const rar=[...new Set(all.map(c=>c.rarity).filter(Boolean))].sort();$('rarity').innerHTML='<option value="">Todas as raridades</option>'+rar.map(x=>`<option>${esc(x)}</option>`).join('');const types=[...new Set(all.flatMap(c=>c.types||[]))].sort();$('type').innerHTML='<option value="">Todos os tipos</option>'+types.map(x=>`<option>${esc(x)}</option>`).join('')}
function apply(){const q=$('q').value.toLowerCase().trim(),s=$('set').value,r=$('rarity').value,t=$('type').value;filtered=all.filter(c=>(!q||String(c.name).toLowerCase().includes(q)||String(c.number||'').toLowerCase().includes(q)||String(c.id).toLowerCase().includes(q))&&(!s||c.setCode===s)&&(!r||c.rarity===r)&&(!t||(c.types||[]).includes(t)));page=1;render()}
function render(){const shown=filtered.slice((page-1)*PAGE,page*PAGE);$('grid').innerHTML=shown.length?shown.map(c=>`<article class="card" onclick="openCard('${esc(c.id)}')"><div class="img"><img loading="lazy" decoding="async" src="${c.images?.large||c.images?.small||''}" alt="${esc(c.name)}"></div><div class="body"><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.number||'')} • ${esc(c.rarity||'Sem raridade')}</div><div class="tag">${esc(c.supertype||'Carta')}</div></div></article>`).join(''):'<div class="empty">🔎 Nenhuma carta encontrada. Escolha um set para carregar o catálogo.</div>';const pages=Math.max(1,Math.ceil(filtered.length/PAGE));let p='';if(pages>1){for(let i=1;i<=pages;i++){if(i<=3||Math.abs(i-page)<=1||i>=pages-2)p+=`<button class="btn page ${i===page?'active':''}" onclick="go(${i})">${i}</button>`;else if(!p.endsWith('…'))p+='<span>…</span>'}}$('pagination').innerHTML=p;$('status').textContent=filtered.length?`${filtered.length} cartas encontradas • página ${page}/${pages}`:'Catálogo conectado.'}
function go(n){page=n;render();scrollTo({top:0,behavior:'smooth'})}
function openCard(id){const c=all.find(x=>x.id===id);if(!c)return;const text=[...(c.attacks||[]).map(a=>a.name),...(c.abilities||[]).map(a=>a.name)].join(' • ');alert(`${c.name}\n${c.id}\n${c.rarity||''}\n${text}`)}
$('q').addEventListener('input',apply);$('rarity').addEventListener('change',apply);$('type').addEventListener('change',apply);$('set').addEventListener('change',async()=>{if($('set').value){$('status').textContent='Carregando set…';try{await loadSet($('set').value);apply()}catch{$('status').textContent='Erro ao carregar o set.'}}else apply()});$('refresh').onclick=()=>load();load();</script></body></html>
