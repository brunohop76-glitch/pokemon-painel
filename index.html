<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O DIÁRIO TCG — Retro FireRed</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2a1209}
body{font-family:Arial,Helvetica,sans-serif}
#app{width:100%;height:100%;border:0;display:block;background:#2a1209}
</style>
</head>
<body>
<iframe id="app" src="app.html" title="O DIÁRIO TCG"></iframe>
<script>
const style = `
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--retro-red:#d73a24;--retro-red2:#f04b28;--retro-gold:#f5b51b;--retro-cream:#ffe9bd;--retro-brown:#3a1d10;--retro-brown2:#5a2d14;--retro-dark:#21100a;--retro-line:#8f4b20}
*{box-sizing:border-box}html,body{min-height:100%;background:#6a3518!important}body{color:#fff!important;font-family:Arial,Helvetica,sans-serif!important}
.app{min-height:100vh!important;background-color:#6a3518!important;background-image:radial-gradient(circle at 15% 20%,rgba(255,210,110,.12) 0 2px,transparent 3px),radial-gradient(circle at 80% 70%,rgba(0,0,0,.18) 0 2px,transparent 3px),linear-gradient(135deg,#8b481d 0%,#542611 42%,#32150b 100%)!important;background-size:70px 70px,90px 90px,100% 100%!important;position:relative;overflow:hidden}
.app:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(90deg,rgba(255,230,160,.06) 1px,transparent 1px),linear-gradient(rgba(255,230,160,.04) 1px,transparent 1px);background-size:18px 18px;z-index:0}
.top{height:68px!important;background:rgba(35,14,7,.96)!important;border-bottom:3px solid var(--retro-gold)!important;padding:0 24px!important;box-shadow:0 5px 0 rgba(0,0,0,.25),0 8px 20px rgba(0,0,0,.25)!important;z-index:20!important}
.brand{font-family:'Press Start 2P',monospace!important;font-size:17px!important;letter-spacing:-1px;color:#fff!important;text-shadow:3px 3px #000}.brand span{color:#ffd33d!important}
.pill{border:2px solid var(--retro-gold)!important;background:#32170b!important;color:#ffe8b0!important;border-radius:999px!important;font-weight:900!important}
.btn{background:linear-gradient(#ef5530,#bc2e1c)!important;border:2px solid #ffca43!important;color:#fff!important;box-shadow:inset 0 1px rgba(255,255,255,.35),0 4px 0 #6e1b11!important;border-radius:9px!important}.btn.dark{background:#3a1c0d!important;border-color:#9b5a24!important;box-shadow:none!important}.btn.danger{background:linear-gradient(#ef4b39,#a71f18)!important;border-color:#ff9c4a!important}
.layout{grid-template-columns:240px 1fr!important;position:relative;z-index:2}
.side{background:linear-gradient(180deg,rgba(57,27,12,.98),rgba(31,14,7,.98))!important;border-right:3px solid var(--retro-gold)!important;padding:20px 12px!important;min-height:calc(100vh - 68px)!important;top:68px!important;box-shadow:8px 0 20px rgba(0,0,0,.22)!important;overflow:hidden}
.side:before{content:'';position:absolute;left:20px;bottom:28px;width:145px;height:145px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png') center/contain no-repeat;opacity:.18;filter:saturate(.8);pointer-events:none}.side:after{content:'';position:absolute;right:-18px;top:74px;width:135px;height:135px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png') center/contain no-repeat;opacity:.12;pointer-events:none}
.side h3{color:#f4c36a!important;font-family:'Press Start 2P',monospace!important;font-size:9px!important;letter-spacing:1px!important}.nav{color:#ffe7bc!important;border-radius:9px!important;padding:13px 12px!important;font-weight:800!important;text-shadow:1px 1px #000}.nav:hover,.nav.active{background:linear-gradient(90deg,#b62f1d,#74200f)!important;color:#fff!important;border-left:4px solid #ffd12d!important;padding-left:8px!important;box-shadow:inset 0 0 0 1px #f1a92d,0 3px 0 #3b150a!important}
.main{padding:24px 30px 38px!important;max-width:1750px!important;position:relative;z-index:3}
.titleRow{grid-template-columns:minmax(0,1fr) minmax(360px,520px)!important;gap:22px!important;margin-bottom:14px!important}.title h1,.pokeHero h1{font-family:'Press Start 2P',monospace!important;color:#fff!important;text-shadow:3px 3px #321308!important;letter-spacing:-1px}.title h1{font-size:30px!important}.title p,.pokeHero p{color:#ffe0aa!important;font-weight:700!important}
.search,.pokeTools input{background:#2c150b!important;border:2px solid #a45a24!important;color:#fff!important;box-shadow:inset 0 2px 5px #0008!important}.search::placeholder,.pokeTools input::placeholder{color:#c9a77d!important}.controls{gap:10px!important}
.filters{margin:10px 0 18px!important}.chip,.pokeTools button{border:2px solid #9b5a24!important;background:#3b1d0d!important;color:#ffe5b3!important;font-weight:800!important;box-shadow:0 3px 0 #211008!important}.chip:hover{border-color:#ffd13b!important}.chip.active,.pokeTools button.active{background:linear-gradient(#e85a2c,#b62c1b)!important;border-color:#ffcf45!important;color:#fff!important}
.content{grid-template-columns:215px 1fr!important;gap:20px!important}.filterbox{background:rgba(42,20,10,.92)!important;border:2px solid #9b5a24!important;border-radius:13px!important;box-shadow:0 7px 20px #0007!important}.filterbox select,.field input,.field select,.field textarea{background:#2a140a!important;border:2px solid #8e4b20!important;color:#fff!important}.count{color:#f2c77d!important}
.grid{grid-template-columns:repeat(5,minmax(180px,1fr))!important;gap:15px!important}.card{background:linear-gradient(180deg,#5a2b12,#2a140a)!important;border:2px solid #a95d22!important;border-radius:12px!important;box-shadow:0 8px 18px #0008,0 0 0 2px #2a1008 inset!important}.card:hover{border-color:#ffd13b!important;transform:translateY(-3px)!important}.cardImg{height:285px!important;background:#efe0c5!important;border-bottom:3px solid #8c481d!important}.tag{background:#df3c22!important;border:2px solid #ffcb43!important;box-shadow:2px 2px 0 #5e160e!important}.body{padding:12px!important}.name{color:#fff!important;text-shadow:1px 1px #000}.meta{color:#e0b67a!important}.price{color:#ffe2a3!important}.stock{color:#72e58e!important}.actions .btn{flex:1}
.empty{background:rgba(38,17,8,.65)!important;border:2px dashed #a45a24!important;color:#f0c98c!important}
.drawer{background:rgba(17,7,3,.82)!important}.modal{background:#32170b!important;border:2px solid #a95d22!important;box-shadow:0 20px 60px #000b!important}.modalHead{border-bottom:2px solid #8c481d!important}.lookup{background:#421f0d!important;border:2px solid #a45a24!important}.lookupTop input{background:#261109!important;border:2px solid #8c481d!important}.preview{background:#3a1b0c!important;border:2px solid #a45a24!important}.marketBox{background:#271108!important;border:2px solid #8c481d!important}.msg.ok{background:#194d2a!important}.msg.err{background:#641d17!important}
.pokeHero{background:linear-gradient(135deg,#7b3517,#35170b)!important;border:2px solid #c47728!important;box-shadow:0 8px 20px #0007!important}
.pokeGrid{gap:12px!important}.pokeCard{background:#35190b!important;border:2px solid #8f4b20!important}.pokeCard.owned{border-color:#4fd26f!important}.pokeImg{background:radial-gradient(circle,#8b481e,#241008 72%)!important}
.top:before{content:'';position:absolute;right:360px;top:-28px;width:110px;height:110px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png') center/contain no-repeat;opacity:.12;pointer-events:none}.top:after{content:'';position:absolute;right:120px;top:-10px;width:120px;height:120px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png') center/contain no-repeat;opacity:.1;pointer-events:none}
.main:before{content:'';position:absolute;right:2%;top:4%;width:190px;height:190px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png') center/contain no-repeat;opacity:.09;pointer-events:none}.main:after{content:'';position:absolute;left:0;bottom:0;width:210px;height:210px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png') center/contain no-repeat;opacity:.08;pointer-events:none}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,minmax(180px,1fr))!important}}
@media(max-width:1000px){.layout{display:block!important}.side{position:sticky!important;top:68px!important;min-height:0!important;height:auto!important;border-right:0!important;border-bottom:3px solid #d99a27!important;overflow-x:auto!important;white-space:nowrap!important}.side:before,.side:after{display:none}.nav{display:inline-flex!important;width:auto!important;margin:0 3px!important}.main{padding:18px 16px 30px!important}.grid{grid-template-columns:repeat(3,minmax(170px,1fr))!important}.titleRow{display:block!important}.controls{margin-top:12px!important}}
@media(max-width:700px){.top{height:58px!important;padding:0 12px!important}.brand{font-size:12px!important}.layout{display:block!important}.side{top:58px!important}.main{padding:14px 10px 24px!important}.title h1{font-size:20px!important}.title p{font-size:11px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}.cardImg{height:220px!important}.content{grid-template-columns:1fr!important}.filterbox{position:static!important}.controls{display:flex!important}.controls .search{min-width:0!important}.chip{white-space:nowrap!important}.filters{overflow-x:auto!important;flex-wrap:nowrap!important}.modal{width:100%!important}.formGrid,.preview{grid-template-columns:1fr!important}}
`;
function patch(){
 const f=document.getElementById('app');
 try{
  const d=f.contentDocument||f.contentWindow.document;
  if(!d||!d.head)return;
  if(!d.getElementById('retro-fire-red-theme')){const s=d.createElement('style');s.id='retro-fire-red-theme';s.textContent=style;d.head.appendChild(s)}
  d.querySelectorAll('.nav').forEach(n=>{const t=(n.textContent||'').trim();if(/estoque/i.test(t))n.remove();if(/minha\s+pokedex/i.test(t))n.textContent=t.replace(/Minha\s+Pok[eé]dex/i,'Minhas Cartas')});
  d.querySelectorAll('h1,h2,h3,.title').forEach(el=>{if(/Minha\s+Pok[eé]dex/i.test(el.textContent))el.textContent=el.textContent.replace(/Minha\s+Pok[eé]dex/ig,'Minhas Cartas')});
  if(!d.getElementById('retro-phrase')){const p=d.createElement('div');p.id='retro-phrase';p.textContent='Sua jornada Pokémon começa aqui — colecione, organize e viva sua aventura!';p.style.cssText='position:fixed;left:255px;bottom:8px;color:#ffe0a4;font:700 11px Arial,sans-serif;opacity:.75;z-index:9999;pointer-events:none;text-shadow:1px 1px #000';d.body.appendChild(p)}
 }catch(e){console.error(e)}
}
document.getElementById('app').addEventListener('load',()=>{patch();setTimeout(patch,800);setTimeout(patch,2500)});
</script>
</body>
</html>
