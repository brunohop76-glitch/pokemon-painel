<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O DIÁRIO TCG - Painel</title>
<link rel="stylesheet" href="retro-final.css?v=20260817-4">
<style>
html,body{margin:0;background:#1b0804!important;color:#fff4dc!important;font-family:Arial,sans-serif!important;overflow-x:hidden!important}
#loading{padding:30px;text-align:center;background:#1b0804;color:#fff4dc;min-height:100vh}
</style>
</head>
<body>
<div id="loading">Abrindo O DIÁRIO TCG...</div>
<script>
(async function(){
  try{
    const v='?v=20260817-4';
    const response=await fetch('app.html'+v,{cache:'no-store'});
    if(!response.ok) throw new Error('app.html '+response.status);
    let html=await response.text();
    html=html.replace('</head>','<link rel="stylesheet" href="retro-final.css'+v+'">\n</head>');
    html=html.replace('</body>','<script src="enhancements.js'+v+'"><\/script>\n</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='Não foi possível abrir o painel.<br><br><button onclick="location.reload()">Tentar novamente</button>';
  }
})();
</script>
</body>
</html>
