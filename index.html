<style>

</style>

<body>
<iframe id="app" src="app.html" title="O DIÁRIO TCG"></iframe>
<script>
const style = `
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--red:#d83b24;--red2:#f04d29;--gold:#f7bd25;--cream:#ffe7b1;--brown:#3a1a0b;--brown2:#5a2b12;--deep:#1d0b06;--line:#a35b20}
*{box-sizing:border-box}html,body{min-height:100%;background:#1d0b06!important;color:#fff!important;font-family:Arial,Helvetica,sans-serif!important}
.app{min-height:100vh!important;position:relative;overflow:hidden!important;background-color:#633015!important;background-image:radial-gradient(circle at 12% 20%,rgba(255,208,90,.14) 0 2px,transparent 3px),radial-gradient(circle at 78% 68%,rgba(0,0,0,.24) 0 2px,transparent 3px),linear-gradient(135deg,#783b18 0%,#5a2a12 45%,#301308 100%)!important;background-size:82px 82px,105px 105px,100% 100%!important}
.app:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.32;background-image:linear-gradient(90deg,rgba(255,228,154,.06) 1px,transparent 1px),linear-gradient(rgba(255,228,154,.035) 1px,transparent 1px);background-size:20px 20px}
.app:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.09;background-image:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png'),url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png'),url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png'),url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/94.png'),url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png');background-repeat:no-repeat;background-size:150px,210px,190px,150px,190px;background-position:15% 7%,92% 31%,18% 82%,72% 75%,88% 86%;filter:saturate(.8)}
.top{height:72px!important;background:rgba(29,10,5,.97)!important;border-bottom:3px solid var(--gold)!important;padding:0 26px!important;box-shadow:0 5px 0 rgba(0,0,0,.28),0 10px 25px rgba(0,0,0,.28)!important;z-index:20!important;position:sticky!important;top:0!important}
.brand{width:160px;height:58px!important;background:#071020 url('./logo.svg') center/contain no-repeat!important;border-radius:12px!important;font-size:0!important;text-shadow:none!important;box-shadow:0 3px 0 #0006,inset 0 0 0 1px #24385f}.brand span{display:none!important}
.topActions{gap:10px!important}.pill{border:2px solid var(--gold)!important;background:#2c1309!important;color:#ffe6ac!important;border-radius:999px!important;font-weight:900!important;padding:9px 15px!important}.topActions .btn{padding:11px 17px!important}
.btn{background:linear-gradient(#ef5530,#bd301d)!important;border:2px solid #ffc944!important;color:#fff!important;box-shadow:inset 0 1px rgba(255,255,255,.35),0 4px 0 #6a1a10!important;border-radius:9px!important}.btn.dark{background:#3a1b0c!important;border-color:#a15b24!important;box-shadow:none!important}.btn.danger{background:linear-gradient(#e94b35,#a92018)!important;border-color:#ff9c4a!important}
.layout{grid-template-columns:270px 1fr!important;position:relative;z-index:2}.side{background:linear-gradient(180deg,rgba(48,22,10,.985),rgba(27,11,6,.985))!important;border-right:3px solid var(--gold)!important;padding:24px 12px!important;min-height:calc(100vh - 72px)!important;top:72px!important;box-shadow:9px 0 25px rgba(0,0,0,.28)!important;overflow:hidden}.side h3{color:#f2c56b!important;font-family:'Press Start 2P',monospace!important;font-size:10px!important;letter-spacing:1px!important;margin-left:12px!important}.side:before{content:'';position:absolute;left:-5px;bottom:-12px;width:185px;height:185px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png') center/contain no-repeat;opacity:.15;pointer-events:none}.side:after{content:'';position:absolute;right:-35px;top:145px;width:160px;height:160px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png') center/contain no-repeat;opacity:.12;pointer-events:none}.nav{color:#ffe7be!important;border-radius:10px!important;padding:13px 14px!important;font-weight:900!important;text-shadow:1px 1px #000!important;margin:4px 0!important}.nav:hover,.nav.active{background:linear-gradient(90deg,#c83a20,#8c2414)!important;color:#fff!important;border-left:4px solid #ffd52f!important;padding-left:10px!important;box-shadow:inset 0 0 0 1px #f0a42b,0 3px 0 #351107!important}
.main{padding:28px 30px 40px!important;max-width:1750px!important;position:relative;z-index:3}.titleRow{grid-template-columns:minmax(0,1fr) minmax(390px,520px)!important;gap:22px!important;margin-bottom:14px!important}.title h1,.pokeHero h1{font-family:'Press Start 2P',monospace!important;color:#fff!important;text-shadow:3px 3px #311108!important;letter-spacing:-1px}.title h1{font-size:30px!important}.title p,.pokeHero p{color:#ffe0ad!important;font-weight:700!important}.search,.pokeTools input{background:rgba(35,14,7,.94)!important;border:2px solid #a35b20!important;color:#fff!important;box-shadow:inset 0 2px 6px #0009!important}.search::placeholder,.pokeTools input::placeholder{color:#c6a27a!important}.controls{gap:10px!important}.filters{margin:10px 0 18px!important}.chip,.pokeTools button{border:2px solid #9c581f!important;background:#32170a!important;color:#ffe4ae!important;font-weight:900!important;box-shadow:0 3px 0 #1d0a05!important}.chip.active,.pokeTools button.active{background:linear-gradient(#e75a2c,#b82d1a)!important;border-color:#ffd047!important;color:#fff!important}
.content{grid-template-columns:205px 1fr!important;gap:20px!important}.filterbox{background:rgba(42,19,9,.95)!important;border:2px solid #96521e!important;border-radius:13px!important;box-shadow:0 8px 22px #0008!important}.filterbox select,.field input,.field select,.field textarea{background:#261108!important;border:2px solid #874719!important;color:#fff!important}.count{color:#f1c578!important}
.grid{grid-template-columns:repeat(5,minmax(195px,1fr))!important;gap:16px!important}.card{background:linear-gradient(180deg,#5d2b11,#271107)!important;border:2px solid #9d551e!important;border-radius:13px!important;overflow:hidden!important;box-shadow:0 10px 22px #0009,0 0 0 2px #251006 inset!important;transition:.16s!important}.card:hover{border-color:#ffd13b!important;transform:translateY(-4px)!important;box-shadow:0 14px 28px #000b,0 0 0 2px #f0a51f44 inset!important}.cardImg{height:292px!important;background:linear-gradient(145deg,#f4e6cc,#dfcda8)!important;border-bottom:3px solid #824318!important}.cardImg img{padding:5px!important}.tag{background:#d93d22!important;border:2px solid #ffce48!important;box-shadow:2px 2px 0 #5a160d!important}.body{padding:12px!important}.name{color:#fff!important;font-size:15px!important;text-shadow:1px 1px #000}.meta{color:#e0b476!important}.price{color:#ffe0a0!important;font-size:18px!important}.stock{color:#74e58e!important}.actions{gap:7px!important}.actions .btn{flex:1!important}
.empty{background:rgba(36,15,7,.72)!important;border:2px dashed #a35b20!important;color:#f1c98e!important}.drawer{background:rgba(15,5,2,.84)!important}.modal{background:#32170a!important;border:2px solid #a95d22!important;box-shadow:0 22px 70px #000c!important}.modalHead{border-bottom:2px solid #8c481d!important}.lookup{background:#421f0d!important;border:2px solid #a45a24!important}.lookupTop input{background:#261109!important;border:2px solid #8c481d!important}.preview{background:#3a1b0c!important;border:2px solid #a45a24!important}.marketBox{background:#271108!important;border:2px solid #8c481d!important}.msg.ok{background:#194d2a!important}.msg.err{background:#641d17!important}
.pokeHero{background:linear-gradient(135deg,#7b3517,#35170b)!important;border:2px solid #c47728!important;box-shadow:0 8px 20px #0007!important}.pokeGrid{gap:12px!important}.pokeCard{background:#35190b!important;border:2px solid #8f4b20!important}.pokeCard.owned{border-color:#4fd26f!important}.pokeImg{background:radial-gradient(circle,#8b481e,#241008 72%)!important}
.top:before{content:'';position:absolute;right:330px;top:-30px;width:120px;height:120px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png') center/contain no-repeat;opacity:.12;pointer-events:none}.top:after{content:'';position:absolute;right:120px;top:-5px;width:120px;height:120px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/143.png') center/contain no-repeat;opacity:.1;pointer-events:none}
.main:before{content:'';position:absolute;right:1%;top:3%;width:200px;height:200px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png') center/contain no-repeat;opacity:.08;pointer-events:none}.main:after{content:'';position:absolute;left:0;bottom:-15px;width:220px;height:220px;background:url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png') center/contain no-repeat;opacity:.07;pointer-events:none}
/* dashboard */
.page.active .card{min-height:120px}.page.active .cardImg{height:210px!important}.page.active .grid{grid-template-columns:repeat(4,minmax(200px,1fr))!important}
/* cleaner card list */
.grid .card .body,.grid .card .actions{position:relative;z-index:2}.grid .card:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,206,77,.04),transparent 35%,rgba(0,0,0,.18));z-index:0}
@media(max-width:1450px){.grid{grid-template-columns:repeat(4,minmax(195px,1fr))!important}.page.active .grid{grid-template-columns:repeat(4,minmax(190px,1fr))!important}}
@media(max-width:1050px){.layout{display:block!important}.side{position:sticky!important;top:72px!important;min-height:0!important;height:auto!important;border-right:0!important;border-bottom:3px solid #d99a27!important;overflow-x:auto!important;white-space:nowrap!important}.side:before,.side:after{display:none}.nav{display:inline-flex!important;width:auto!important;margin:0 3px!important}.main{padding:18px 16px 30px!important}.grid,.page.active .grid{grid-template-columns:repeat(3,minmax(170px,1fr))!important}.titleRow{display:block!important}.controls{margin-top:12px!important}}
@media(max-width:720px){.top{height:60px!important;padding:0 10px!important}.brand{width:125px;height:50px!important}.layout{display:block!important}.side{top:60px!important}.main{padding:14px 10px 24px!important}.title h1{font-size:20px!important}.title p{font-size:11px!important}.grid,.page.active .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}.cardImg{height:220px!important}.content{grid-template-columns:1fr!important}.filterbox{position:static!important}.controls{display:flex!important}.controls .search{min-width:0!important}.chip{white-space:nowrap!important}.filters{overflow-x:auto!important;flex-wrap:nowrap!important}.modal{width:100%!important}.formGrid,.preview{grid-template-columns:1fr!important}.top:before,.top:after{display:none!important}}
`;
function patch(){
 const f=document.getElementById('app');
 try{
  const d=f.contentDocument||f.contentWindow.document;
  if(!d||!d.head)return;
  let s=d.getElementById('retro-fire-red-theme');
  if(!s){s=d.createElement('style');s.id='retro-fire-red-theme';d.head.appendChild(s)}
  s.textContent=style;
  d.querySelectorAll('.nav').forEach(n=>{const t=(n.textContent||'').trim();if(/estoque/i.test(t))n.remove();if(/minha\s+pok[eé]dex/i.test(t))n.textContent=t.replace(/Minha\s+Pok[eé]dex/i,'Minhas Cartas')});
  d.querySelectorAll('h1,h2,h3,.title').forEach(el=>{if(/Minha\s+Pok[eé]dex/i.test(el.textContent))el.textContent=el.textContent.replace(/Minha\s+Pok[eé]dex/ig,'Minhas Cartas')});
  const old=d.getElementById('retro-phrase');if(old)old.remove();
  if(!d.getElementById('retro-phrase')){const p=d.createElement('div');p.id='retro-phrase';p.textContent='© 2025 O DIÁRIO TCG • Colecione, organize e viva sua jornada Pokémon!';p.style.cssText='position:fixed;left:292px;bottom:8px;color:#ffe0a4;font:700 11px Arial,sans-serif;opacity:.72;z-index:9999;pointer-events:none;text-shadow:1px 1px #000';d.body.appendChild(p)}
 }catch(e){console.error(e)}
}
document.getElementById('app').addEventListener('load',()=>{patch();setTimeout(patch,600);setTimeout(patch,1800);setTimeout(patch,3500)});
</script>
</body>
