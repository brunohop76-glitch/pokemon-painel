<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendas — O DIÁRIO TCG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#170604;--bg2:#321006;--panel:#421707;--panel2:#260b04;--orange:#e65b18;--red:#c83a16;--gold:#ffc62b;--cream:#fff0cf;--text:#fff7e6;--muted:#d7a66d;--line:#93430f;--green:#8fe69a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(239,91,20,.28),transparent 28%),radial-gradient(circle at 8% 100%,rgba(122,34,7,.42),transparent 34%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 4px),linear-gradient(135deg,#170604 0,#3a1207 50%,#180603 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:linear-gradient(180deg,#361107,#210803);border-bottom:3px solid var(--gold);box-shadow:0 3px 0 #8d2e0c,0 7px 20px #0009;padding:0 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.brand{font-size:20px;font-weight:900;text-shadow:2px 2px #702008}.brand span{color:var(--gold)}.btn{background:linear-gradient(180deg,#f47a1b,#d64416);border:2px solid var(--gold);color:#fff9ec;border-radius:9px;padding:10px 14px;font-weight:900;box-shadow:inset 0 1px #ffffff45,0 5px 12px #0007}.btn.dark{background:#2a0c05;border-color:#9b4713;box-shadow:none;color:#ffe6b7}.btn.danger{background:linear-gradient(180deg,#df351c,#9f150d);border-color:#ff7131}.wrap{max-width:1550px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#571d07,#2a0c04);border:2px solid #b25216;border-radius:16px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}.hero:after{content:'💰';position:absolute;right:25px;top:8px;font-size:100px;opacity:.08}.hero h1{margin:0 0 6px;font-size:32px;text-shadow:3px 3px #6b2108}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:linear-gradient(180deg,#441908,#260a04);border:2px solid var(--line);border-radius:13px;padding:16px}.stat small{color:var(--muted);display:block}.stat b{display:block;font-size:25px;margin-top:5px;color:var(--cream)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:12px}.search{flex:1;background:#1d0804;color:#fff1d2;border:2px solid #a04b13;border-radius:9px;padding:11px}.tablebox{background:linear-gradient(180deg,rgba(68,25,8,.98),rgba(35,10,4,.98));border:2px solid var(--line);border-radius:13px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:12px;border-bottom:1px solid #6d2c0a;text-align:left}.table th{color:#ffd990;font-size:12px;background:#2a0c05}.table td{font-size:13px}.muted{color:var(--muted)}.profit{color:var(--green);font-weight:900}.empty{text-align:center;padding:45px;color:var(--muted)}.drawer{position:fixed;inset:0;background:#160402e8;display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.drawer.open{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#2b0c05;border:2px solid #b15315;border-radius:16px}.modalHead{padding:15px 18px;border-bottom:2px solid #8f4110;display:flex;justify-content:space-between;align-items:center}.modalBody{padding:18px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:900;color:#f1cb96}.field input,.field select,.field textarea{background:#1d0804;color:#fff1d2;border:2px solid #a04b13;border-radius:9px;padding:10px}.field textarea{min-height:85px}.msg{padding:10px;border-radius:8px;margin-bottom:12px;display:none}.msg.ok{display:block;background:#18391d;color:#a7ffb9}.msg.err{display:block;background:#4a120d;color:#ffb4a1}.cardPreview{display:flex;gap:12px;background:#1d0703;border:1px solid #8b400e;border-radius:10px;padding:10px;margin-top:8px}.cardPreview img{width:80px;height:110px;object-fit:contain;background:#eee;border-radius:5px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:650px){.top{height:58px;padding:0 10px}.brand{font-size:16px}.wrap{padding:12px 10px 25px}.hero h1{font-size:26px}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat b{font-size:20px}.toolbar{flex-direction:column;align-items:stretch}.formGrid{grid-template-columns:1fr}.field.full{grid-column:auto}.table{min-width:700px}}
</style>
</head>
<body>
<header class="top"><button class="btn dark" onclick="location.href='index.html'">← Painel</button><div class="brand">💰 Vendas <span>• O DIÁRIO TCG</span></div></header>
<main class="wrap">
<section class="hero"><h1>💰 Controle de Vendas</h1><p>Registre suas vendas, acompanhe o faturamento e dê baixa automaticamente no estoque da sua coleção.</p></section>
<section class="stats"><div class="stat"><small>Vendas realizadas</small><b id="statSales">0</b></div><div class="stat"><small>Faturamento</small><b id="statRevenue">R$ 0,00</b></div><div class="stat"><small>Custo das cartas</small><b id="statCost">R$ 0,00</b></div><div class="stat"><small>Lucro estimado</small><b id="statProfit">R$ 0,00</b></div></section>
<div class="toolbar"><input id="search" class="search" placeholder="🔎 Buscar venda, carta ou cliente..."><button class="btn" onclick="openSale()">＋ Registrar venda</button><button class="btn dark" onclick="loadAll()">↻ Atualizar</button></div>
<div class="tablebox"><table class="table"><thead><tr><th>Data</th><th>Carta</th><th>Cliente</th><th>Qtd.</th><th>Venda</th><th>Custo</th><th>Lucro</th><th>Pagamento</th><th></th></tr></thead><tbody id="salesBody"></tbody></table></div>
</main>
<div id="saleModal" class="drawer"><div class="modal"><div class="modalHead"><b>Registrar venda</b><button class="btn dark" onclick="closeSale()">✕</button></div><div class="modalBody"><div id="msg" class="msg"></div><form id="saleForm" onsubmit="return saveSale(event)"><div class="formGrid"><div class="field full"><label>Carta da coleção *</label><select id="cardId" required onchange="updateCardPreview()"><option value="">Selecione uma carta...</option></select><div id="cardPreview"></div></div><div class="field"><label>Quantidade *</label><input id="saleQty" type="number" min="1" value="1" required></div><div class="field"><label>Valor da venda (R$) *</label><input id="salePrice" inputmode="decimal" required></div><div class="field"><label>Cliente</label><input id="customer" placeholder="Nome do cliente"></div><div class="field"><label>Pagamento</label><select id="payment"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Mercado Pago</option><option>Outro</option></select></div><div class="field"><label>Data da venda *</label><input id="saleDate" type="date" required></div><div class="field full"><label>Observações</label><textarea id="saleNotes" placeholder="Ex.: envio, troca, marketplace..."></textarea></div></div><div class="actions"><button type="button" class="btn dark" onclick="closeSale()">Cancelar</button><button id="saveBtn" class="btn">💾 Confirmar venda</button></div></form></div></div></div>
<script>
const SUPA_URL='https://txhktdwwxjdswtedupud.supabase.co',SUPA_KEY='sb_publishable_odjEzAe1A-F4ur1PsXIuRA_qomQzX44',db=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let cards=[],sales=[];
const $=id=>document.getElementById(id);const num=v=>Number(String(v||'0').replace(/\./g,'').replace(',','.'))||0;const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function openSale(){ $('saleForm').reset();$('saleDate').value=new Date().toISOString().slice(0,10);$('msg').style.display='none';fillCards();$('saleModal').classList.add('open') }
function closeSale(){ $('saleModal').classList.remove('open') }
function fillCards(){const available=cards.filter(c=>Number(c.quantidade||0)>0);$('cardId').innerHTML='<option value="">Selecione uma carta...</option>'+available.map(c=>`<option value="${c.id}">${esc(c.nome)} — ${esc(c['coleção']||c.colecao||'')} — ${Number(c.quantidade||0)} un.</option>`).join('')}
function updateCardPreview(){const c=cards.find(x=>String(x.id)===String($('cardId').value));if(!c){$('cardPreview').innerHTML='';return}const max=Number(c.quantidade||0);$('saleQty').max=max;$('salePrice').value=Number(c['preço']||c.preco||0).toFixed(2).replace('.',',');$('cardPreview').innerHTML=`<div class="cardPreview">${c.foto_url?`<img src="${esc(c.foto_url)}" alt="">`:''}<div><b>${esc(c.nome)}</b><div class="muted">${esc(c['coleção']||c.colecao||'')} • estoque: ${max}</div><div class="muted">Custo unitário: ${money(c.custo||c.preco_custo||0)}</div></div></div>`}
async function loadAll(){const [cr,sr]=await Promise.all([db.from('cartas').select('*').order('nome'),db.from('vendas').select('*').order('data_venda',{ascending:false})]);if(cr.error){renderError(cr.error);return}if(sr.error){renderError(sr.error);return}cards=cr.data||[];sales=sr.data||[];renderSales();}
function renderError(e){$('salesBody').innerHTML=`<tr><td colspan="9" class="empty">Erro ao carregar vendas: ${esc(e.message||e)}</td></tr>`}
function renderSales(){const q=$('search').value.toLowerCase().trim();const filtered=sales.filter(s=>(!q||[s.carta_nome,s.cliente,s.pagamento,s.observacoes].join(' ').toLowerCase().includes(q)));const revenue=sales.reduce((a,s)=>a+Number(s.valor_total||0),0),cost=sales.reduce((a,s)=>a+Number(s.custo_total||0),0);$('statSales').textContent=sales.length;$('statRevenue').textContent=money(revenue);$('statCost').textContent=money(cost);$('statProfit').textContent=money(revenue-cost);$('salesBody').innerHTML=filtered.length?filtered.map(s=>`<tr><td>${new Date(s.data_venda+'T12:00:00').toLocaleDateString('pt-BR')}</td><td><b>${esc(s.carta_nome||'')}</b><div class="muted">${esc(s.carta_set||'')}</div></td><td>${esc(s.cliente||'—')}</td><td>${s.quantidade}</td><td>${money(s.valor_total)}</td><td>${money(s.custo_total)}</td><td class="profit">${money(Number(s.valor_total||0)-Number(s.custo_total||0))}</td><td>${esc(s.pagamento||'—')}</td><td><button class="btn danger" style="padding:6px 9px;font-size:11px" onclick="deleteSale('${s.id}')">Excluir</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">📦 Nenhuma venda registrada ainda.</td></tr>'}
async function saveSale(e){e.preventDefault();const c=cards.find(x=>String(x.id)===String($('cardId').value));const qty=Number($('saleQty').value)||0;if(!c||qty<1)return false;const stock=Number(c.quantidade||0);if(qty>stock){showMsg('Estoque insuficiente. Você possui '+stock+' unidade(s).','err');return false}const total=num($('salePrice').value)*qty,costUnit=Number(c.custo||c.preco_custo||0),costTotal=costUnit*qty;const btn=$('saveBtn');btn.disabled=true;btn.textContent='⏳ Salvando...';try{const row={carta_id:c.id,carta_nome:c.nome,carta_set:c['coleção']||c.colecao||'',quantidade:qty,valor_unitario:num($('salePrice').value),valor_total:total,custo_unitario:costUnit,custo_total:costTotal,cliente:$('customer').value.trim()||null,pagamento:$('payment').value,data_venda:$('saleDate').value,observacoes:$('saleNotes').value.trim()||null};const ins=await db.from('vendas').insert([row]);if(ins.error)throw ins.error;const upd=await db.from('cartas').update({quantidade:stock-qty}).eq('id',c.id);if(upd.error){await db.from('vendas').delete().eq('id',row.id);throw upd.error}closeSale();await loadAll()}catch(err){showMsg(err.message||'Não foi possível registrar a venda.','err')}finally{btn.disabled=false;btn.textContent='💾 Confirmar venda'}return false}
async function deleteSale(id){const s=sales.find(x=>String(x.id)===String(id));if(!s||!confirm('Excluir esta venda e devolver as unidades ao estoque?'))return;const c=cards.find(x=>String(x.id)===String(s.carta_id));try{if(c){const upd=await db.from('cartas').update({quantidade:Number(c.quantidade||0)+Number(s.quantidade||0)}).eq('id',c.id);if(upd.error)throw upd.error}const del=await db.from('vendas').delete().eq('id',id);if(del.error)throw del.error;await loadAll()}catch(e){alert('Erro: '+(e.message||e))}}
function showMsg(text,type){$('msg').className='msg '+type;$('msg').textContent=text;$('msg').style.display='block'}
$('search').addEventListener('input',renderSales);loadAll();
</script>
</body></html>
