<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decks — O DIÁRIO TCG</title><style>:root{--bg:#170604;--panel:#351006;--orange:#e65b18;--gold:#ffc62b;--text:#fff3d5;--muted:#d4a36e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#170604,#3a1207,#170604);color:var(--text);font-family:Arial,sans-serif}.top{height:64px;padding:10px 18px;display:flex;align-items:center;gap:12px;background:#260904;border-bottom:3px solid var(--gold);position:sticky;top:0}.btn{background:linear-gradient(#f47a1b,#c83a16);border:2px solid var(--gold);color:white;padding:9px 13px;border-radius:8px;font-weight:900;cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:22px 16px}.hero,.panel{background:linear-gradient(#421607,#230904);border:2px solid #93430f;border-radius:13px;padding:18px;box-shadow:0 8px 22px #0008}.hero h1{margin:0 0 5px}.hero p{color:var(--muted);margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.input{background:#180603;color:white;border:2px solid #93430f;border-radius:8px;padding:10px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.slot{background:#2a0b04;border:1px solid #93430f;border-radius:9px;padding:12px}.slot b{display:block}.muted{color:var(--muted);font-size:12px;margin-top:4px}.danger{background:#8d1b0e}.save{margin-top:12px}.empty{text-align:center;padding:30px;color:var(--muted);border:1px dashed #93430f;border-radius:10px}@media(max-width:600px){.wrap{padding:12px 10px}.list{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><button class="btn" onclick="location.href='index.html'">← Painel</button><b>🧠 Análise de Deck</b></header><main class="wrap"><section class="hero"><h1>Montador de Deck</h1><p>Monte uma lista, acompanhe quantidades e veja a distribuição do seu deck.</p></section><section class="panel" style="margin-top:15px"><div class="toolbar"><input id="name" class="input" placeholder="Nome do deck"><input id="card" class="input" placeholder="Nome da carta"><button class="btn" onclick="add()">+ Adicionar</button><button class="btn" onclick="save()">💾 Salvar</button></div><div id="stats" class="muted"></div><div id="list" class="list"><div class="empty">Adicione cartas para começar.</div></div></section></main><script>let deck=JSON.parse(localStorage.getItem('odtcg_deck_draft')||'[]');function render(){const list=document.getElementById('list');if(!deck.length){list.innerHTML='<div class="empty">Adicione cartas para começar.</div>';document.getElementById('stats').textContent='0 cartas';return}list.innerHTML=deck.map((x,i)=>`<div class="slot"><b>${x.name}</b><div class="muted">Quantidade: ${x.qty}</div><button class="btn" style="margin-top:8px" onclick="inc(${i})">+ 1</button> <button class="btn danger" style="margin-top:8px" onclick="del(${i})">Remover</button></div>`).join('');document.getElementById('stats').textContent=`${deck.reduce((a,x)=>a+x.qty,0)} cartas • ${deck.length} nomes diferentes`}function add(){const v=document.getElementById('card').value.trim();if(!v)return;let x=deck.find(a=>a.name.toLowerCase()===v.toLowerCase());if(x)x.qty++;else deck.push({name:v,qty:1});document.getElementById('card').value='';persist();render()}function inc(i){deck[i].qty++;persist();render()}function del(i){deck.splice(i,1);persist();render()}function persist(){localStorage.setItem('odtcg_deck_draft',JSON.stringify(deck))}function save(){const n=document.getElementById('name').value.trim()||'Meu Deck';localStorage.setItem('odtcg_deck_'+n,JSON.stringify(deck));alert('Deck salvo localmente: '+n)}render();</script></body></html>
